version: 1
disable_existing_loggers: True

# Every formatter below references %(correlation_id)s and declares `defaults` for it, so
# this file stands on its own: a copy handed to logging.config.dictConfig by something
# that never imported logging_utils formats cleanly instead of raising ValueError on
# every record. The record factory installed at import of logging_utils remains the
# mechanism that supplies the REAL id -- `defaults` only covers a record created before
# or outside it. The literal must stay in step with CORRELATION_ID_UNSET.

formatters:
  standard_formatter:
    (): traefik_certificate_exporter.libs.logging_utils.CorrelationIdColoredFormatter
    format: "%(asctime)s [%(levelname)8s] [%(correlation_id)s] : %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
    defaults:
      correlation_id: "-"
  standard_detailed_formatter:
    (): traefik_certificate_exporter.libs.logging_utils.CorrelationIdJsonFormatter
    format: "%(asctime)s %(levelname)s %(name)s %(correlation_id)s %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
    defaults:
      correlation_id: "-"

  extended_formatter:
    (): traefik_certificate_exporter.libs.logging_utils.CorrelationIdColoredFormatter
    format: "%(asctime)s [%(levelname)8s] [%(correlation_id)s] %(name)s.%(funcName)s(%(lineno)s) : %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
    defaults:
      correlation_id: "-"
  extended_detailed_formatter:
    (): traefik_certificate_exporter.libs.logging_utils.CorrelationIdJsonFormatter
    format: "%(asctime)s %(name)s %(levelname)s %(process)d %(processName)s %(funcName)s %(lineno)s %(correlation_id)s %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
    defaults:
      correlation_id: "-"

  # Structured console output. Not wired to a handler here: setting
  # TRAEFIK_CERTIFICATE_EXPORTER_LOGGING_CONSOLEJSON=true makes setup_logging() point the
  # console handlers below at these instead of their coloredlogs counterparts, so
  # `correlation_id` reaches `docker logs` as a real field (ADR-0023 Decision 2). The
  # default stays coloured and human-readable.
  standard_json_formatter:
    (): traefik_certificate_exporter.libs.logging_utils.CorrelationIdJsonFormatter
    format: "%(asctime)s %(levelname)s %(name)s %(correlation_id)s %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
    defaults:
      correlation_id: "-"
  extended_json_formatter:
    (): traefik_certificate_exporter.libs.logging_utils.CorrelationIdJsonFormatter
    format: "%(asctime)s %(name)s %(levelname)s %(process)d %(processName)s %(funcName)s %(lineno)s %(correlation_id)s %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
    defaults:
      correlation_id: "-"

handlers:
  standard_file_handler:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: standard_detailed_formatter
    filename: traefik-certificate-exporter.log
    maxBytes: 10485760 # 10MB
    backupCount: 20
    encoding: utf8

  extended_file_handler:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: extended_detailed_formatter
    filename: traefik-certificate-exporter.log
    maxBytes: 10485760 # 10MB
    backupCount: 20
    encoding: utf8

  standard_console_handler:
    class: logging.StreamHandler
    level: INFO
    formatter: standard_formatter
    stream: ext://sys.stdout

  extended_console_handler:
    class: logging.StreamHandler
    level: DEBUG
    formatter: extended_formatter
    stream: ext://sys.stdout

loggers:
  traefik_certificate_exporter_consoleonly:
    handlers: [standard_console_handler]
    level: INFO
    propagate: False

  traefik_certificate_exporter:
    handlers: [standard_console_handler, extended_file_handler]
    level: INFO
    propagate: False

root:
    level: ERROR
    handlers: [standard_console_handler] 
    propagate: False

