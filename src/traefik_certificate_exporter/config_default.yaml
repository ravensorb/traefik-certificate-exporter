# The single key registry: every setting the loader reads is declared here, unset ones as
# `null`. The CLI dest and documented env-name tests derive their valid set from this file.
settings:
  datapath: "./data"
  filespec: "*.json"
  outputpath: "./certs"
  traefikresolverid: null
  resolverinpathname: true
  flat: false
  dryrun: false
  restartcontainers: false
  domains:
    include: []
    exclude: []
  watchforchanges: false
  runatstart: false
  watchinterval: 60
  pkcs12passphrase: null
  postexportcommand: null
  # Apprise destinations notified after an export pass completes. A list, never a
  # comma-separated string -- a comma is legal inside an Apprise URL. From the
  # environment use confuse's indexed keys instead:
  #   TRAEFIK_CERTIFICATE_EXPORTER_SETTINGS_APPRISEURLS_0=...
  # These values are credentials and are redacted from every settings dump.
  # appriseurls:
  #   - "tgram://<bot-token>/<chat-id>"
  #   - "mailto://user:pass@example.com"
  appriseurls: []
