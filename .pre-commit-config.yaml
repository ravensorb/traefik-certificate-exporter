# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# Installed tool trees, not project source. `.agents/` and `.claude/` are vendored BMad
# skills and `_bmad/` is the installed BMad runtime; this project neither authors nor
# maintains them. Linting them contributed 438 of 587 ruff findings and both check-toml
# failures (BMad's *-template.toml files hold `{placeholder}` syntax that is intentionally
# not valid TOML), keeping the gates permanently red.
#
# It is also a safety guard, not only a filter: ruff-check runs with --fix and ruff-format
# rewrites in place, so an --all-files run without this mutates vendored content -- the
# incident recorded as BL-E002-002, where one such run reformatted ~192 files under
# .agents/ and had to be unpicked by hand.
#
# `_bmad-output/` is deliberately in scope: it holds committed project state, and
# check-yaml over it is what catches a malformed issues.yaml.
exclude: '^(\.agents|\.claude|_bmad)/'

repos:
  - repo: local
    hooks:
      - id: poetry-lock
        name: Check poetry.lock consistency
        language: system
        entry: poetry check --lock
        always_run: true
        pass_filenames: false
      - id: justfile-fmt
        name: Check justfile formatting
        language: system
        # Non-mutating: --check reports drift and exits non-zero, it never rewrites.
        # Local-only by necessity, and that is a real coverage limit: CI installs no
        # `just`, so no workflow runs this. It catches the drift that actually happened --
        # one story formatting the shared justfile and a later one unformatting it -- at
        # commit time.
        entry: just --fmt --check --unstable
        files: ^justfile$
        pass_filenames: false
      - id: workflow-policy
        name: Check governed workflow contracts and action policy
        language: system
        entry: poetry run pytest -q tests/ci/test_workflow_contracts.py
        always_run: true
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      # - id: end-of-file-fixer
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
      # Non-mutating twins for `just lint`. A recipe named `check` must not rewrite the
      # tree: the release transaction runs `just check` as its gate and aborts if the tree
      # moves, so an autofix during a release turns a lint nit into a failed release.
      # stages: [manual] keeps them out of the git hook, where autofixing is wanted.
      - id: ruff-check
        alias: ruff-check-nofix
        name: ruff check (no fix)
        args: [--no-fix]
        stages: [manual]
      - id: ruff-format
        alias: ruff-format-check
        name: ruff format (check only)
        args: [--check]
        stages: [manual]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # Epic 7 used annotations as the design-by-contract mechanism for ~1,100 lines of new
  # code while no gate ran a type checker. This hook is that gate, and it is the authority:
  # verify-build.yaml's mypy job runs this hook, and [tool.mypy] in pyproject.toml holds
  # the settings both invocations share.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        files: ^(src/publication_contract/|scripts/(committed_versions|release_version)\.py)
        args: [--config-file=pyproject.toml]
        additional_dependencies: [types-jsonschema==4.25.1.20250822]
