# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# Installed tool trees, not project source. `.agents/` and `.claude/` are vendored BMad
# skills and `_bmad/` is the installed BMad runtime; this project neither authors nor
# maintains them. Linting them contributed 438 of 587 ruff findings and both check-toml
# failures (BMad's *-template.toml files hold `{placeholder}` syntax that is intentionally
# not valid TOML), keeping the gates permanently red.
#
# It is also a safety guard, not only a filter: ruff-check runs with --fix and ruff-format
# rewrites in place, so an --all-files run without this mutates vendored content -- the
# incident recorded as BL-E002-002, where one such run reformatted ~192 files under
# .agents/ and had to be unpicked by hand.
#
# `_bmad-output/` is deliberately in scope: it holds committed project state, and
# check-yaml over it is what catches a malformed issues.yaml.
exclude: '^(\.agents|\.claude|_bmad)/'

repos:
  - repo: local
    hooks:
      - id: poetry-lock
        name: Check poetry.lock consistency
        language: system
        entry: poetry check --lock
        always_run: true
        pass_filenames: false
      # Dependency advisories (research §8; ADR-0042). Audits the venv, whose scope is every
      # poetry.lock group because `just install` and build.yaml run `poetry sync --all-groups`.
      # Not covered: lock entries whose environment marker excludes the running interpreter or
      # platform (e.g. win32-only pywin32, Python-3.10-only exceptiongroup) are never
      # installed, so never audited (BL-E014-023).
      # Needs network access to PyPI/OSV: offline it FAILS, never skips (a skip is a false
      # green) -- except within PyPI's 15-minute cache lifetime (max-age=900) of an online run,
      # when pip's HTTP cache answers and the result is that run's data. CI starts cold.
      # The only remedy besides upgrading is `--ignore-vuln <ID>` in `entry`, with a comment
      # naming the ID, the reason and a BL- key; no tool polices that comment, review does. `--aliases on` prints the GHSA/CVE IDs beside pip-audit's primary PYSEC ID.
      # Every `language: system` hook in this block takes its tool from poetry.lock, not a
      # frozen rev (C-10), so the tools are hashed and audited here: pip-audit,
      # pip-audit-bootstrap, deptry, import-linter and mypy through `poetry run`, and
      # poetry-lock's `poetry` is the dev-group one when pre-commit itself runs under
      # `poetry run` (as `just check` and build.yaml do). `precommit-hook-deps-locked` below
      # refuses hook-built environments; the `poetry run` entries are held by review.
      - id: pip-audit
        name: pip-audit (every poetry.lock group, ADR-0042)
        language: system
        entry: poetry run pip-audit --skip-editable --progress-spinner off --aliases on
        pass_filenames: false
        files: ^(pyproject\.toml|poetry\.lock)$
      # ADR-0042: every hashed CI bootstrap requirements file, selected by this glob and never
      # by name; skipped while the directory is empty. Same offline and --ignore-vuln policy.
      - id: pip-audit-bootstrap
        name: pip-audit (CI bootstrap requirements, ADR-0042)
        language: system
        entry: bash -c 'rc=0; for f; do poetry run pip-audit --require-hashes --disable-pip --progress-spinner off --aliases on -r "$f" || rc=1; done; exit "$rc"' --
        pass_filenames: true
        files: ^\.github/requirements/[^/]+\.txt$
      # Declared-vs-imported dependencies over src/ (review m8, NFR-3); [tool.deptry] holds its config.
      - id: deptry
        name: deptry (declared vs imported dependencies)
        language: system
        entry: poetry run deptry src
        pass_filenames: false
        files: ^(pyproject\.toml|poetry\.lock|src/.*\.py)$
      # Spine AD-13 module layering and no import cycles (SD-01-1); contracts and their
      # coverage are in [tool.importlinter] in pyproject.toml. Version from poetry.lock (dev
      # group), so hashed and audited (BL-E014-112, ADR-0042); no hook env is built.
      # PYTHONPATH=src: import-linter finds the package on sys.path, and it lives under src/.
      - id: import-linter
        name: import-linter (AD-13 layering, no cycles)
        language: system
        entry: env PYTHONPATH=src poetry run lint-imports --no-cache
        pass_filenames: false
        files: ^(pyproject\.toml|src/.*\.py)$
      # Type gate for all of src/ (AD-3). [tool.mypy] in pyproject.toml holds its settings.
      # Runs in the Poetry venv, so mypy, its two stub packages and the runtime dependencies
      # (e.g. confuse) come from poetry.lock and are typed, hashed and audited (BL-E014-112,
      # BL-E015-053, ADR-0042). It replaced the remote pre-commit mypy mirror hook, whose
      # own env typed every runtime dependency as Any.
      - id: mypy
        name: mypy
        language: system
        entry: poetry run mypy
        args: [--config-file=pyproject.toml]
        pass_filenames: true
        files: ^src/
        types_or: [python, pyi]
        require_serial: true
      # justfile-fmt was removed: it needs `just`, which build.yaml does not install, so it
      # would be a local-only check (AD-3).
      # Rule guards (SD-01-2). Each is a one-line regex over standard pre-commit config, not
      # repository policy code (AD-4). They replace the tests retired with tests/ci/.
      # ADR-0033 / RT-008: a `paths` allowlist exempts whole files from secret scanning.
      - id: gitleaks-no-paths-allowlist
        name: .gitleaks.toml sets no paths allowlist (ADR-0033)
        language: pygrep
        entry: '^\s*paths\s*='
        files: ^\.gitleaks\.toml$
      # AD-6 / ADR-0028: checkouts are ref-free on every forge and under act.
      - id: workflows-ref-free-checkout
        name: No workflow sets ref or repository (ADR-0028)
        language: pygrep
        entry: '^\s+(ref|repository):'
        files: ^\.github/workflows/.*\.ya?ml$
      # AD-9 / E014-S02-002: a step or job `if:` never reads `secrets` or `vars` (dot or
      # index form, quoted or bare key); presence rules live once, in job `env`. Coverage
      # limits: a multi-line `if: >-` block is checked on its first line only, and the hook
      # does not check that an `if:` tests exactly one flag (that is held by review).
      - id: workflows-if-no-secrets-vars
        name: No workflow if tests secrets or vars directly (AD-9)
        language: pygrep
        entry: '^\s*(?:-\s+)?["'']?if["'']?\s*:.*\b(secrets|vars)\s*[.\[]'
        files: ^\.github/workflows/.*\.ya?ml$
      # AD-6 / guidelines §7: no workflow depends on the ACT env var.
      - id: workflows-no-act-env
        name: No workflow references ACT (guidelines §7)
        language: pygrep
        entry: '\bACT\b'
        files: ^\.github/workflows/.*\.ya?ml$
      # ADR-0044 / ADR-0030: shipped container scripts ask the installed package for a
      # setting (the init resolver), never read a settings env var themselves -- a second
      # parser disagreed with confuse about `watchforchanges`. Scope is everything the image
      # ships under docker/root/, so the sourced privilege helper is covered too.
      - id: s6-no-raw-settings-env
        name: Shipped container scripts read no settings env var (ADR-0044)
        language: pygrep
        entry: 'TRAEFIK_CERTIFICATE_EXPORTER_SETTINGS_'
        files: ^docker/root/
      # BL-E013-020 / AD-5: every remote repo's rev is a 40-hex commit SHA written by
      # `pre-commit autoupdate --freeze` (`rev: <sha>  # frozen: vX.Y.Z`), so a moved upstream
      # tag cannot change code that runs in the job that builds the published dist.
      # Coverage limit: block-style `rev:` lines in this file only, indented or as the first
      # key of a list item (`- rev:`); a flow-style `{repo: ..., rev: ...}` mapping is not
      # matched. `repo: local` hooks have no rev and
      # are pinned through poetry.lock instead (C-10).
      - id: precommit-revs-frozen
        name: Every pre-commit rev is a frozen commit SHA (BL-E013-020)
        language: pygrep
        entry: '^\s*(?:-\s+)?rev:\s+(?![0-9a-f]{40}\b)'
        files: ^\.pre-commit-config\.yaml$
      # BL-E014-112 / ADR-0042 (as amended by E015-S02-003) / AD-3: no hook declares
      # additional_dependencies and no hook sets a language other than system, pygrep or
      # unsupported (pre-commit >= 4.4's name for system), so pre-commit builds no hook
      # environment from this file's own declarations: a `repo: local` hook's tools must come
      # from the venv that poetry.lock pins -- hashed, audited by pip-audit.
      # Coverage limit: block-style keys in this file only (indented or `- key:`, the key
      # optionally quoted); a flow-style `{id: x, additional_dependencies: [y]}` hook mapping
      # is not matched. A `system` hook's `entry` is not checked: one that calls `uvx`,
      # `pipx run` or a tool found on PATH instead of `poetry run <tool>` bypasses the lock,
      # and is held by review. A remote hook repo's own manifest language is not visible
      # here; those repos (pre-commit-hooks, ruff, zizmor, shellcheck-py, gitleaks,
      # actionlint) are the stated exception, listed with what each fetches in ADR-0042's
      # "Not covered".
      - id: precommit-hook-deps-locked
        name: No pre-commit hook installs unlocked dependencies (BL-E014-112, ADR-0042)
        language: pygrep
        entry: '^\s*(?:-\s+)?["'']?(?:additional_dependencies["'']?\s*:|language["'']?\s*:(?!\s*["'']?(?:system|pygrep|unsupported)["'']?\s*(?:#.*)?$))'
        files: ^\.pre-commit-config\.yaml$
      # ADR-0042 / BL-E013-024: a workflow installs with pip only from a hashed requirements
      # file under .github/requirements/, so the pip-audit-bootstrap glob above sees every
      # package set CI bootstraps outside poetry.lock. Coverage limit: the literal text
      # `pip install` in workflow files (comments included); `pip3 install`, `uv pip` or an
      # install inside a called script or action is not matched.
      - id: workflows-pip-install-from-requirements
        name: Workflow pip installs are hashed, from .github/requirements/ (ADR-0042)
        language: pygrep
        entry: 'pip install(?! --require-hashes -r \.github/requirements/[^/\s]+\.txt\b)'
        files: ^\.github/workflows/.*\.ya?ml$
      # AD-5 / F-07: a LiquidLogicLabs/* action is referenced at a bare major tag `@vN`
      # (optionally quoted, optionally followed by a comment); zizmor's `ref-pin` accepts any
      # ref, `@main` included, so this hook is the enforcement. The owner matches
      # case-insensitively, the `v` does not (`@V6` fails); scope is every YAML file under
      # .github/, so a composite action.yml there is covered too.
      # Coverage limit: block-style `uses:` lines (indented or `- uses:`) with the value on
      # the same line; a flow-style `{uses: ...}` mapping, a quoted `"uses":` key, a folded or
      # next-line value, or a reference built by a called script is not matched.
      - id: workflows-lll-major-tag
        name: LiquidLogicLabs actions are pinned to a major tag @vN (AD-5)
        language: pygrep
        entry: '^\s*(?:-\s+)?uses:\s*(["'']?)(?i:liquidlogiclabs)/(?![^@\s"''#]+@v\d+\1(?:\s+#.*)?\s*$)'
        files: ^\.github/.*\.ya?ml$
      # AD-11 / F-09: no Authorization header on a command line (argv is readable from `ps`
      # and /proc/<pid>/cmdline on the runner; log masking does not hide it). Send it on
      # stdin instead: `printf 'Authorization: token %s\n' "$T" | curl -H @- ...`.
      # Case-insensitive; catches `-H "..."`, `-H'...'`, `-H $'...'`, `-H " ..."`,
      # `--header '...'` and `--header=...`.
      # Coverage limit: a header flag and its value on the same line only -- a value on the
      # next line after a `\` continuation, a header assembled in a variable, or one passed
      # through curl's `--config`/`-K` file is not matched; nor are other credential flags
      # (`-u`/`--user`, `--oauth2-bearer`).
      - id: workflows-no-auth-header-argv
        name: No Authorization header on a command line (F-09, AD-11)
        language: pygrep
        entry: '(?i)(-H|--header)[=\s]*\$?["'']?\s*authorization:'
        files: ^\.github/.*\.ya?ml$
      # AD-8 / F-11: a metadata `pattern={{major}}` tag line (not `{{major}}.{{minor}}`)
      # (a literal prefix such as `v{{major}}` included) carries an `enable=` attribute, so
      # no bare `:0` tag is written while major is 0.
      # Coverage limit: it checks that `enable=` is present on the line, not what the
      # expression evaluates to; the act metadata probe (E014-S02-006 notes) is that evidence.
      - id: workflows-major-tag-gated
        name: Bare major image tag is gated by enable= (F-11, AD-8)
        language: pygrep
        entry: '^(?!.*\benable=).*pattern=[^,{]*\{\{\s*major\s*\}\}(?![.\w])'
        files: ^\.github/.*\.ya?ml$
      # AD-8 / BL-E014-075: the metadata action takes org.opencontainers.image.version from
      # the highest-priority tag, and type=semver (900) outranks type=raw (200), so the
      # full-version raw tag line carries `priority=1000` or 0.3.0 is labelled `0.3`.
      # Coverage limit: it checks that the image-version raw line ends in `,priority=1000`; it
      # does not check that no other tag ties or outranks it (a `type=schedule` line, default
      # 1000, or an explicit priority >= 1000 elsewhere) -- that is held by review and by the
      # act release dry run's label check (release-0.3.0-evidence.md).
      - id: workflows-version-label-priority
        name: Full-version image tag sets the version label (BL-E014-075, AD-8)
        language: pygrep
        entry: 'type=raw,value=\$\{\{\s*needs\.build\.outputs\.image-version\s*\}\}(?!,priority=1000\s*$)'
        files: ^\.github/.*\.ya?ml$
      # AR-3: `latest` must only move for the highest release tag, so every `latest` tag line
      # must carry the validate-tag gate. Coverage limit: it checks that the gate is present
      # on the line, not that validate-tag computes it correctly (held by review and the
      # release dry run).
      - id: workflows-latest-tag-gated
        name: latest image tag is gated on the highest release tag (AR-3, AD-8)
        language: pygrep
        entry: 'type=raw,value=latest(?!,enable=\$\{\{\s*needs\.validate-tag\.outputs\.is-latest\s*==\s*''true''\s*\}\}\s*$)'
        files: ^\.github/.*\.ya?ml$
      # AD-18 / BL-E014-108: docker/setup-buildx-action v4 removed its `config` and
      # `config-inline` inputs (now `buildkitd-config`/`buildkitd-config-inline`); the old
      # name is dropped (the runner only warns `Unexpected input(s)`), so the CA import's
      # BuildKit file never reaches `buildx create`. actionlint validates `with:` keys only
      # for popular actions in its embedded data referenced at a major tag (and local `./`
      # actions), so it checks no SHA-pinned step here (AD-5) -- this hook is the static
      # enforcement. pygrep cannot tie a key to its step, so the two names are refused for
      # every action; a legitimate `config:` input elsewhere needs this hook narrowed in the
      # same change.
      # Coverage limit: the two removed key names only, block style (indented or `- key:`,
      # optionally quoted), lower case, in files under .github/workflows/ and
      # .github/actions/ only (a composite action elsewhere is not seen); a flow-style
      # `with: {config: x}` or a case variant (`Config:`) is not matched, and other actions'
      # removed or renamed inputs are not seen. The runner's `Unexpected input(s)` warning,
      # read in the per-release checklist, covers those; it is not CI-gating.
      - id: workflows-no-removed-buildx-inputs
        name: No removed setup-buildx config/config-inline input (AD-18, BL-E014-108)
        language: pygrep
        entry: '^\s*(?:-\s+)?["'']?config(?:-inline)?["'']?\s*:'
        files: ^\.github/(workflows|actions)/.*\.ya?ml$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      # - id: end-of-file-fixer
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Held on 0.16.x: v0.17.0 autofixes 9 new findings in src/ and tests/, a code change
    # outside BL-E013-020; the bump is its own change.
    rev: f12be1ebaa5351c1fc76472de98db2c3446c8253  # frozen: v0.16.10
    hooks:
      # Python only, on every ruff hook. Upstream's ruff-format declares
      # `types_or: [python, pyi, jupyter, markdown]`, so it rewrites Python code fences
      # inside .md too -- which silently reindented and rewrapped the code this epic's
      # closure reports quote as evidence of what a file said when a reviewer read it.
      # Tidying an ADR is a nicety; editing a record is not, and the diff explains
      # neither. Held by review of this file (CODEOWNERS); no test pins it.
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/gitleaks/gitleaks
    # Held at v8.30.1: `autoupdate --freeze` picks the newest tag reachable from upstream's
    # default branch, which is v8.30.0 -- a downgrade (v8.30.1 is not on that branch).
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      # `entry` is overridden, not `args`: upstream puts the whole invocation in entry as
      # `gitleaks git --pre-commit --redact --staged --verbose`, which scans the *index*.
      # Under `--all-files` -- what CI runs -- nothing is staged, so it read ~0 bytes,
      # reported no leaks and exited 0. See .gitleaks.toml for the reproduction.
      - id: gitleaks
        entry: gitleaks dir --redact --no-banner --config .gitleaks.toml .
        always_run: true
        pass_filenames: false
      # Scans every commit in history, which `gitleaks dir` above does not read (AD-3 as
      # amended by ADR-0036). Selected on its own with `pre-commit run gitleaks-history`.
      - id: gitleaks
        alias: gitleaks-history
        name: gitleaks (history)
        entry: gitleaks git --redact --no-banner --config .gitleaks.toml
        always_run: true
        pass_filenames: false

  # Shell lint for every script the image ships (ADR-0044). The s6 scripts' shebang is
  # `#!/usr/bin/with-contenv bash`, which `identify` does not classify as `shell`, so they
  # are matched as `executable`; the sourced privilege helper is matched as `shell`.
  # `rev` is SHA-frozen with `pre-commit autoupdate --freeze --repo <url>` (AD-3).
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229  # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck
        files: ^docker/root/
        # Upstream declares `types: [shell]`, which `types_or` cannot widen (pre-commit
        # requires every `types` tag AND one `types_or` tag); reset it to `file`.
        types: [file]
        types_or: [shell, executable]

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  # Workflow security audit (AD-5). Reads .github/zizmor.yml, which zizmor discovers by
  # default; that file holds the unpinned-uses pin policy. The auditor persona makes every
  # audit stricter and is the only persona that reports secrets-outside-env (ADR-0039).
  # A future false positive is suppressed per line with an inline
  # `# zizmor: ignore[<audit>]` citing an AD/ADR (ADR-0036 §4), never by a severity floor
  # or a persona change.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor
        args: [--persona=auditor]
