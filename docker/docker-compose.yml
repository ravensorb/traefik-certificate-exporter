services:
  traefik-certificate-exporter:
    image: ravensorb/traefik-certificate-exporter:latest
    environment:
      # Names follow TRAEFIK_CERTIFICATE_EXPORTER_SETTINGS_<KEY> (see docker/README.md). Values are
      # unquoted on purpose: in list form Compose passes quotes through as part of the value.
      # The config file is always /config/config.yaml (mount ./data/config below).
      - TRAEFIK_CERTIFICATE_EXPORTER_SETTINGS_FILESPEC=*.json                # Define this to set the file spec to watch for changes
      - TRAEFIK_CERTIFICATE_EXPORTER_SETTINGS_TRAEFIKRESOLVERID=resolver-http # Define this to set the resolver id to match against
      - TRAEFIK_CERTIFICATE_EXPORTER_SETTINGS_RESOLVERINPATHNAME=true        # Define this to include the resolver name in the output path
      # - TRAEFIK_CERTIFICATE_EXPORTER_SETTINGS_DRYRUN=true                  # Define this to indicate you want to do a dry run (don't actually export or restart)
      # - TRAEFIK_CERTIFICATE_EXPORTER_SETTINGS_FLAT=true                    # Define this to export all certificates in a single flat folder
      - TRAEFIK_CERTIFICATE_EXPORTER_SETTINGS_RESTARTCONTAINERS=true         # Define this to indicate if containers with label set should be restarted
      # - TRAEFIK_CERTIFICATE_EXPORTER_SETTINGS_DOMAINS_INCLUDE=             # comma separated list of domain names to only export
      # - TRAEFIK_CERTIFICATE_EXPORTER_SETTINGS_DOMAINS_EXCLUDE=             # comma separated list of domain names to exclude from exporting
      # - TRAEFIK_CERTIFICATE_EXPORTER_LOGGING_LEVEL=DEBUG                   # Log level (DEBUG, INFO, WARNING, ERROR, CRITICAL; default INFO)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Only needed if restarting containers. WARNING: `ro` does NOT limit API calls over the socket -- any mount (ro or rw) grants host-root-equivalent control. Prefer a restart-only socket proxy (e.g. Tecnativa/docker-socket-proxy) in production.
      - ./data/config:/config:rw                      # Only needed if you are going to set a config file to load
      - ./data/letsencrypt:/data:ro                   # Location of your acme files. Keep `:ro` -- required for the unprivileged
                                                      # (PUID/PGID) mode, which also needs the files readable by PUID/PGID; Traefik keeps them 0600
      - ./data/certs:/certs:rw                        # Location you want to export certificates to
