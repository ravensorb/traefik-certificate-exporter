settings:
  filespec: "*.json"
  # traefikresolverid:
  resolverinpathname: true
  flat: false
  dryrun: false
  restartcontainers: false
  domains:
    include: []
    exclude: []
  watchforchanges: false
  runatstart: false
  watchinterval: 60
  # pkcs12passphrase:                      # Passphrase used to encrypt the exported PKCS12 (.pfx) file (default: unencrypted)
  # postexportcommand:                     # Shell-like command line run after a successful export pass (see README.md)

# Logging is configured from the environment, not from this file (it is set up before this
# file is read). CONSOLEONLY and CONSOLEJSON default to off for a PyPI install; the Docker
# image sets CONSOLEONLY=true (and CONSOLEJSON=false):
#   TRAEFIK_CERTIFICATE_EXPORTER_LOGGING_CONSOLEONLY=true   # console only, no log file
#   TRAEFIK_CERTIFICATE_EXPORTER_LOGGING_CONSOLEJSON=true   # console as JSON, so
#                                                           # correlation_id is a field
#   TRAEFIK_CERTIFICATE_EXPORTER_LOGGING_LEVEL=DEBUG        # log level when -ll is not given
#                                                           # (default INFO); the container's
#                                                           # verbosity switch
