    issue: BL-E014-111
    proposal: _bmad-output/implementation-artifacts/epic-014/epic-closure/spec-proposals/AD-1.md
  AD-2:
    severity: MAJOR
    title: "The `import-linter` hook was added at the sprint-01 closure (SD-01-1 fix), after ADR-0042 had defined the audit scope. It declares `additional_dependencies: [import-linter==2.15]`. That pins one package. Its requirements on PyPI are `click>=6`, `grimp>=3.17`, `rich>=14.2.0` and `typing-extensions>=3.10`, and pre-commit resolves them fresh, unhashed and unaudited at environment install. The `mirrors-mypy` hook resolves mypy's own dependencies the same way. These environments are installed and executed in `build.yaml`'s `build` job (`pre-commit run --all-files`, `:62-63`), the same job that runs `poetry build` and uploads `dist` (`:68-71`). The `v0.3.0` release run shows this: `Initializing environment for local:import-linter==2.15` at 17:01:14Z in `build / build`. ADR-0042's \"Not covered, stated\" list says hook environments \"are pinned by frozen SHAs (AD-3, AD-5)\". That is true for the hook repositories but false for their PyPI closures. The `precommit-revs-frozen` comment claims local hooks are pinned through `additional_dependencies`. ADR-0046 item 6 and the S02-003 spine pass restated the frozen-rev rationale without covering this hook. It is not in the backlog."
    disposition: spec-proposal
    spec: _bmad-output/planning-artifacts/architecture/architecture-ci-cd-pipeline-2026-10-08/ARCHITECTURE-SPINE.md#ad-3--local-and-ci-gates-are-one-hook-list-adopted
