findings:
  AD-1:
    severity: MAJOR
    title: "**Evidence, verified live on 2026-10-12.** `git.ravenwolf.org/…:0.3.0` resolves to `sha256:244015fe…` with label `org.opencontainers.image.revision=c7394e26…` on amd64 and arm64. `docker.io/ravensorb/…:0.3.0` resolves to `sha256:e3be0498…` with revision `046016b3…`. `ghcr.io/…:0.3.0` is not found, and `gh release view v0.3.0` reports \"release not found\". The real `v0.3.0` tag (`git cat-file -p v0.3.0`) points at `046016b`. The Gitea artifacts were therefore published, by the evidence file's own account, from \"a tag [that] exists only in the deleted clone\", using the maintainer's admin token from a local process environment rather than a forge `release` environment. GitHub run 38281339396 then published PyPI and Docker Hub only. The wheel and sdist hashes match across PyPI and Gitea (`6f8dd26a…`, `39fbc9c4…`) because the build is reproducible. The image is not equal: one version now has two digests, which is the split \"topology B\" that E014-S02-007 decision 1 (`:54`) rejected because \"it would build the image and the packages twice and break AD-10's one digest\". The story's AC 6 (six `enabled` lines), AC 8 (one digest across nine lookups) and AC 9 (a forge release with the wheel and sdist) are unmet. The story is nevertheless `status: done`, its completion evidence records only Docker Hub, and no ADR, spine Changelog line or backlog item records the reduced scope or the out-of-band Gitea publish."
    disposition: spec-proposal
    spec: _bmad-output/planning-artifacts/architecture/architecture-ci-cd-pipeline-2026-10-08/ARCHITECTURE-SPINE.md#ad-9--configuration-gated-destinations-one-forge-per-release-adopted
    adr:
