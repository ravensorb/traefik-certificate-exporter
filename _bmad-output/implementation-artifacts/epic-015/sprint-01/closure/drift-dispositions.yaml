  SD-01-5:
    severity: MINOR
    title: "ruff is now pinned twice, by the pre-commit hook's frozen `rev` and by the Poetry dev group, and a test keeps the two equal. The comment directly above (`pyproject.toml:37-38`) states the project convention for gate tools: `repo: local` hooks versioned by `poetry.lock` (C-10). ADR-0050 Decision 4 still says \"ruff is a pre-commit hook, not a dev dependency\", and its Consequences say \"nothing else changes\", although PGH004 is now selected. The amendment mentions both changes but does not replace that text."
    disposition: resolved-in-code
