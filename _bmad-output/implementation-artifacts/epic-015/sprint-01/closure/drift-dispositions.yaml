  SD-01-1:
    severity: MAJOR
    title: In root mode the shipped loader lets a `.env` file add only the variable names of `any-source` settings. It removes every other name that file adds (`LOGGING_*`, `LD_PRELOAD`, `DOCKER_HOST`, `PATH`, …). S01-001 AC 3 says "Other `.env` keys load as today", and PRD FR-18 covers only the environment-only keys. The decision is recorded in the ADR-0049 amendment (2026-10-12, Decision 4 replaced) and in spine AD-2, but the requirement that downstream planning reads still describes the narrower rule.
    disposition: adr-justified
