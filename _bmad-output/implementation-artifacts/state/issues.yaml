backlog:
- key: BL-E001-001
  epic: '001'
  sprint: S01
  title: 'Package import crashed under pytest: cli_args.py parsed real sys.argv at import time (parse_args -> parse_known_args fix applied in E001-S01-001)'
  source: dev-loop (E001-S01-001)
  severity: Medium
  status: backlog
  description: "Discovered while writing the redaction test: importing traefik_certificate_exporter (via __init__.py -> app.py -> cli_args.py) called argparse.parse_args() against the host process's real argv, so any test runner or embedding context crashed on unrecognized flags. Fixed by switching to parse_known_args(); recording here since this affects all of Epic 1's test-writing work, not just this story."
- key: BL-E001-002
  epic: '001'
  sprint: S01
  title: AcmeCertificateExporter.__exportCertificate never returned its names list (fixed in E001-S01-003)
  source: dev-loop (E001-S01-003)
  severity: Medium
  status: backlog
  description: 'Discovered writing ACME parsing regression tests: the private per-certificate export method built a names list but had no return statement, so exportCertificatesForFile always got None back for every wrapped/unwrapped ACME shape. Verified against git HEAD (unchanged since tag v0.1.2.0) -- this is a real, long-standing gap, not an artifact of this session''s edits. Scope is narrower than first reported: certificate export to disk (writing .pem/.pfx/.key files) happens as a side effect inside __exportCertificate BEFORE this return statement, so it was never affected -- confirmed working correctly, consistent with the maintainer''s report. The only consumer of the missing return value is DockerManager.restartLabeledContainers via exportCertificates()''s aggregated domain list -- so this bug is only observable when settings.restartContainers/--restart-container is enabled. Maintainer confirmed restart-on-label is used sometimes (not often) -- so this was a real, if infrequent, silent failure of that feature, not a purely theoretical gap. Fixed by adding the missing return; severity kept at Medium to reflect the actual (optional-feature-only, occasionally-exercised) blast radius.'
- key: BL-E001-003
  epic: '001'
  sprint: S01
  title: Multi-resolver ACME export used list.append instead of list.extend, nesting domain lists (fixed in E001-S01-003)
  source: dev-loop (E001-S01-003)
  severity: Medium
  status: backlog
  description: "exportCertificatesForFile appended each resolver's whole domain list into the outer names list instead of extending it, producing a nested list. Same scope note as BL-E001-002: certificate export to disk is unaffected; this only corrupts the domain list DockerManager.restartLabeledContainers receives, so it is only observable with the optional restart-on-label feature enabled and more than one Traefik certificate resolver configured. Maintainer confirmed restart-on-label is used sometimes -- so this combined with BL-E001-002 to silently drop restarts on those occasions. Fixed alongside the missing-return bug."
- key: BL-E001-004
  epic: '001'
  sprint: S01
  title: 'RETRACTED: config precedence "fix" was based on the agent''s own undocumented assumption, not a confirmed defect -- reverted'
  source: dev-loop (E001-S01-003)
  severity: Low
  status: resolved
  description: The agent changed SettingsManager.loadFromFile so a config file would outrank an env var, believing this matched a documented precedence -- but that documentation (docs/guidelines.md section 5) was itself written by the agent earlier in the same session, never confirmed against the maintainer's actual intent. The maintainer confirmed the original behavior (CLI > env var > config file > packaged default) was correct and already working in production -- this is the standard pattern for a Docker-first tool, where env vars are the vehicle for per-deployment overrides of a static/mounted config file. The code change was reverted; docs/guidelines.md, docs/developer.md, docs/operational.md, the architecture spine, the PRD, and epics.md were all corrected to state the right precedence. Recorded as a lesson, not a shipped defect.
- key: BL-E001-005
  epic: '001'
  sprint: S01
  title: Secret-redaction regex is pattern-based and could miss an oddly-named future secret field
  source: sprint-closure adversarial review (E001-S01)
  severity: Low
  status: backlog
  description: The redaction pattern (secret|password|passphrase|token|api[_-]?key) covers the current and documented conventions but is not exhaustive; a future field named e.g. 'credential' or 'bearer' would not be caught. Consider expanding the pattern list if new secret-shaped settings are added that don't match it.
- key: BL-E001-006
  epic: '001'
  sprint: S01
  title: parse_known_args() silently ignores unrecognized CLI args in production, not just under pytest
  source: sprint-closure adversarial review (E001-S01)
  severity: Low
  status: backlog
  description: The fix for the import-time argv-parsing crash (parse_args -> parse_known_args) is necessary for testability but as a side effect means a genuine CLI typo (e.g. --dtaa-path) is now silently ignored in the real console-script entry point too, rather than erroring. A more complete fix would move argument parsing out of module-import time and into main() specifically, so production invocations can still hard-fail on unrecognized flags while imports (tests, embedding) remain safe -- but that is a larger architectural change than this story's scope (a testability blocker fix) warranted.
- key: BL-E002-001
  epic: '002'
  sprint: S01
  title: confuse 2.0.1 crashed under Python 3.14 (pkgutil.get_loader removed) -- discovered upgrading the base image, fixed by updating to confuse 2.2.1 (already allowed by the existing ^2.0.1 constraint)
  source: dev-loop (E002-S01-002/003)
  severity: High
  status: backlog
  description: "Verified live: building the reworked Docker image against the newly-upgraded Alpine 3.24 base (which ships Python 3.14) crashed at startup with AttributeError: module pkgutil has no attribute get_loader, inside confuse.Configuration.__init__ -> util.find_package_path. confuse's own changelog confirms 2.1.0 replaced pkgutil.get_loader with importlib.util.find_spec specifically for Python 3.13/3.14 compatibility. Fixed via poetry update confuse (2.0.1 -> 2.2.1, already within the existing ^2.0.1 constraint, no pyproject.toml change needed). Verified end-to-end: built image now starts, loads config, and enters its normal watch loop without crashing."
- key: BL-E002-002
  epic: '002'
  sprint: S01
  title: "Agent process note: pre-commit run --all-files caused 192-file unintended reformat; recovered by reverting out-of-scope files and reconstructing .pre-commit-config.yaml's ruff/gitleaks/actionlint hooks from pre-commit's local cache + session memory"
  source: dev-loop (E002-S01-004, process incident)
  severity: Low
  status: backlog
  description: "While verifying Epic 2 changes, running 'pre-commit run --all-files' applied ruff-check --fix and ruff-format repo-wide, touching ~200 unrelated tracked files including installed BMad skill scripts under .agents/. Reverted via git checkout to the 12 files actually in scope for Epics 1-2. This also reverted uncommitted-but-legitimate earlier work in .pre-commit-config.yaml (the ruff/gitleaks/actionlint hook wiring), which had to be reconstructed from pre-commit's local cache directory (~/.cache/pre-commit/repo*, each has a git remote identifying which tool) plus prior session context. Also discovered poetry lock --check no longer exists in Poetry 2.0+; replaced with poetry check --lock. Lesson recorded in agent memory: never run pre-commit --all-files with mutating hooks (ruff-check/ruff-format) on an existing repo; scope with --files to only the touched paths."
- key: BL-E007-001
  epic: '007'
  sprint: ''
  title: Publishers must promote verified-dist-v1 rather than rebuild, and nothing consumes it yet
  source: post-restore audit (E007)
  severity: High
  status: backlog
  description: "ARCHITECTURE-SPINE.md requires publishers to promote verified-dist-v1 rather than rebuild the Python package. verify-build.yaml revalidates SHA256SUMS and build-manifest.json, performs native image smoke from the exact wheel, uploads verified-dist-v1, and exposes its identity outputs. The deleted legacy publishers no longer violate the rule, but no active publisher consumes the bundle yet. This closes through E008-S01-001 and E008-S01-002, which implement development and stable publication from the exact retained distributions and one image build per channel run."
- key: BL-E007-002
  epic: '007'
  sprint: ''
  title: Local Act execution is still unproven, and running it destroyed the repository once
  source: post-restore audit (E007)
  severity: Medium
  status: backlog
  description: "The local verifier path has never completed successfully. The one attempt on 2026-09-01 destroyed the working tree and all local commits: ~/.actrc sets --bind so act mounts the real repository as the container workspace, and verify-build.yaml's actions/checkout deletes the workspace contents before discovering it cannot fetch the pinned ref. docker/act-build.sh now runs act inside a disposable clone with --no-hardlinks, refuses to proceed unless the clone resolves elsewhere, and is pinned by test_local_wrapper_never_runs_act_against_the_working_tree. That makes the path SAFE but still UNPROVEN -- no successful run exists. Closing this needs an actual green run whose result is retained. Note the clone verifies HEAD, not the dirty working tree, which is what CI verifies anyway."
- key: BL-E007-003
  epic: '007'
  sprint: ''
  title: Workflow-native run correlation evidence is not yet implemented
  source: post-restore audit (E007)
  severity: Medium
  status: backlog
  description: 'build-manifest.json intentionally stays deterministic and records source/version, distribution hashes, image inputs, and the image-plan fingerprint; it must not gain run identity or publication outcomes. E008-S01-001/002/003 and E009-S01-002 close this operational gap by emitting the workflow run ID/URL, manifest and artifact hashes, published image digest and inspected platforms, Release URL, and alias outcomes through action/workflow outputs and the workflow run summary. Close only after GitHub and the pinned Gitea tuple both retain and expose that correlation evidence; no publication-plan or release-receipt schema is required.'
- key: BL-E007-004
  epic: '007'
  sprint: ''
  title: Bake exposes ATTESTATIONS but the verifier enables no SBOM or provenance attestation
  source: post-restore audit (E007)
  severity: Low
  status: backlog
  description: docker-bake.hcl defaults ATTESTATIONS to [] and verify-build.yaml neither enables type=sbom/type=provenance nor scans the built image, in an epic whose subject is reproducible build and verification. The Docker standards overlay is a stub, so this is provisional guidance rather than a hard rule. Decide explicitly -- enable attestations on the verified build, or record in ADR-0008 why they are deferred to the publication epic.
- key: BL-E000-001
  epic: '000'
  sprint: ''
  title: pre-commit --all-files silently skips untracked files, and this has now caused a false green twice
  source: post-restore audit
  severity: Medium
  status: backlog
  description: 'pre-commit --all-files enumerates git ls-files, so any gate reports green over a set that excludes untracked work. This first appeared when the whole E007 delivery was untracked and every gate skipped it. It recurred on 2026-09-01 against a brand-new mypy gate: the gate passed a deliberately planted type error because src/publication_contract/ had not been staged. Both times the gate looked green while checking nothing. There is no mechanical guard for this -- the practical rule is to stage before trusting an --all-files result, and to prove any new gate with a planted violation rather than a green run. Worth considering a repo-level check that fails when tracked-vs-untracked coverage diverges.'
- key: BL-E008-001
  epic: '008'
  sprint: ''
  title: 'No workflow reacts to push: main and v* tags are unverified until E008-S8.1 lands dev.yaml'
  source: legacy cutover
  severity: High
  status: resolved
  resolution: 'Closed by E008-S01-001: .github/workflows/dev.yaml reacts to pushes on the protected default branch and calls verify-build.yaml exactly once for the event SHA, with every publisher transitively gated on it. test_any_push_triggered_workflow_verifies_before_it_ships is no longer vacuous -- it now examines a real push workflow -- and it was not weakened to get there. Residual, tracked by its own stories rather than by this item: pushes of v* tags are still unverified until release.yaml lands (E008-S01-002 / E008-S01-003).'
  description: Deleting build.yaml with the rest of the legacy publish path removed the only push-triggered workflow. ci.yaml is pull_request-only, so pushes to main and v* tags now run nothing. This is the same exposure the deleted test.yaml left behind, reintroduced deliberately as part of the cutover rather than by accident, because the workflow doing the verifying could not succeed. It closes when E008-S01-001 adds .github/workflows/dev.yaml and the stable-release orchestrator lands, both calling verify-build.yaml as thin adapters. test_any_push_triggered_workflow_verifies_before_it_ships was reshaped to assert the conditional invariant -- any push-triggered workflow must reach the verifier before anything that ships -- so it passes vacuously now and bites the moment a push workflow reappears. Do NOT close this by weakening that test; close it by landing dev.yaml.
- key: BL-E008-002
  epic: '008'
  sprint: '01'
  title: dev.yaml pairs the pusher's github.actor with the forge package token, coupling the credential to whoever pushed
  source: code-review (E008-S01-001)
  severity: Low
  status: backlog
  description: "publish-package-forge passes user: ${{ github.actor }} alongside secrets.FORGE_PACKAGE_TOKEN. Gitea's basic auth resolves a token supplied as the password regardless of the username, so it works, but the username varies per push and is unrelated to whoever minted the token. Prefer __token__, or a documented vars.FORGE_PACKAGE_USER alongside FORGE_PACKAGE_TOKEN. Raised as LOW-5 in _bmad-output/implementation-artifacts/epic-008/sprint-01/closure/review-E008-S01-001.md."
- key: BL-E008-003
  epic: '008'
  sprint: '01'
  title: release.yaml pins the protected default branch as origin/main rather than deriving it from the event
  source: code-review (E008-S01-002) — LOW-1
  severity: Low
  status: resolved
  resolution: 'Closed at E008/S01 sprint closure (arch-drift MEDIUM-3). release.yaml now derives DEFAULT_BRANCH_REF from github.event.repository.default_branch and refuses an empty one by name, rather than composing a bare origin/ and failing inside merge-base for a reason unrelated to reachability. dev.yaml refuses an empty default branch before its just-in-time checkout, because actions/checkout with an empty ref silently falls back to the default branch and would appear correct while proving nothing. test_the_default_branch_is_named_once_and_derived_everywhere_else keeps the literal inside the on: trigger, which is the one place GitHub accepts no expression and therefore the authority for the name. The Gitea availability this item deferred to E009 is now fail-closed rather than assumed: if the forge supplies nothing, both channels refuse instead of guessing.'
  description: "release.yaml's stable tag guard sets DEFAULT_BRANCH_REF: origin/main (release.yaml:131) and refuses a commit not reachable from it via `git merge-base --is-ancestor` (:162). github.event.repository.default_branch carries the same value from the source of truth, but its availability on Gitea is unproven, so the literal is fail-closed rather than wrong. POINTER CORRECTED: this originally described the value being passed to scripts/stable_tags.py --reachable-from, which was deleted when the publication path moved to plain git in workflow steps. The defect is unchanged and live; only the mechanism moved. Resolve by deriving the ref once E009 proves what Gitea supplies."
- key: BL-E008-004
  epic: '008'
  sprint: '01'
  title: DOCKERHUB_REPOSITORY is a new repository variable introduced by release.yaml and needs an operator decision on its value
  source: implementation assumption (E008-S01-002)
  severity: Low
  status: resolved
  description: Docker Hub's namespace cannot be derived from the forge owner, so PUBLISH_IMAGE_DOCKERHUB is honoured only alongside a lowercase <namespace>/<repository> in the DOCKERHUB_REPOSITORY repository variable; an enabled toggle without one fails the plan job (fail-closed, as an unrecognised forge does). The variable and its DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets are documented in docs/operational.md but have never been set for this repository, so the Docker Hub destination is untested end to end. Story 8.4's cutover should set them or record that the destination stays off.
- key: BL-E008-005
  epic: '008'
  sprint: ''
  title: 'Upstream: command injection in LiquidLogicLabs/git-action-tag-info (not exploitable here -- our validation precedes use)'
  source: E008 script-to-action evaluation
  severity: Medium
  status: backlog
  description: "CORRECTED FROM Critical TO Medium after checking reachability. The flaw is real: src/git-client.ts runs every git call as execSync(`git ${command}`) with the tag name concatenated in unescaped -- isAnnotatedTag uses `cat-file -t refs/tags/${tagName}`, getTagInfo uses `rev-parse refs/tags/${tagName}` and `verify-tag ${tagName}`. No execFile, no argv array, no quoting. Shell metacharacters ARE legal git refnames: git check-ref-format accepts 'v1.0.0;id', 'v1.0.0|whoami', 'v1.0.0$(id)', 'v1.0.0&&id' and backtick forms, and all match a 'v*' trigger. BUT it is NOT exploitable in this repository, which is why the original Critical rating was wrong. Such a tag is invalid under SemVer 2.0.0 (prerelease and build identifiers are [0-9A-Za-z-] only) and is rejected by our own anchored STABLE_TAG shape check; and release.yaml's plan job validates the tag shape as its third step, before the tag name reaches any shell -- the current implementation passes it via argv anyway. So for us this is a constraint on WHERE the action may be used, never before validation, rather than an open hole. Upstream it is a genuine defect: the action's documented purpose invites passing github.ref_name directly, and it neither validates nor warns. The sibling action git-action-tag-validate-version already has the correct pattern in src/git.ts -- execFileAsync('git', ['rev-parse','--verify','--quiet',trimmed]) -- so the fix is mechanical. Report upstream; until fixed, only call git-action-tag-info after a shape check."
- key: BL-E008-006
  epic: '008'
  sprint: '01'
  title: No guard derives the publication destination-key vocabulary from the plan job that emits it
  source: code-review (E008-S01-003) — L6, deferred
  severity: Medium
  promoted: 'Low -> Medium at E008 epic closure. Unchanged in substance and still fail-closed -- the finalizer gate refuses a result for a destination the enabled set does not name, and refuses a destination with no result, so a typo halts the run rather than skipping a publisher. Promoted for its class rather than its blast radius: eleven guard-reach defects were found in this epic, every one of them a correct rule over a hand-enumerated set, and this is the last hand-spelled scope left in the publication path -- 3 occurrences in release.yaml plus 12 in the contract suite, with nothing deriving the vocabulary from the plan job that emits it. The epic''s own evidence is that this shape does not stay correct.'
  status: backlog
  description: "The publication destination-key vocabulary -- 'image-forge', 'image-dockerhub', 'package-forge', 'package-pypi' -- is spelled by hand in release.yaml's plan step (3 occurrences) and in tests/ci/test_workflow_contracts.py (12), with no guard deriving the set from the plan job that emits it. Fail-closed today because the finalizer gate refuses a result for a destination the enabled set does not name, and refuses a destination with no result -- so a typo stops the run rather than skipping a publisher silently. POINTER CORRECTED: this originally named finalizer_gate.evaluate, deleted when the gate became a jq program in the workflow step. The defect is unchanged and live; only the mechanism moved."
- key: BL-E008-007
  epic: '008'
  sprint: '01'
  title: Branch protection must require code-owner review, or CODEOWNERS is documentation
  source: sprint closure — redteam M4
  severity: Medium
  status: backlog
  description: "E008 sprint closure added .github/CODEOWNERS covering the workflows, the guard registries, the ADRs, the gate configuration and the agent-instruction trees, and test_the_authority_surfaces_are_owned derives the required set from where those things live. The file requests review and enforces nothing on its own: it has teeth only when the default branch's protection rules require code-owner review. No test in this repository can observe that setting, and the guard's own docstring says so rather than implying coverage it does not have. Until it is enabled, one approval can still widen a privilege grant and relax the guard that reports on it in the same diff. Owner action, outside the tree."
- key: BL-E008-008
  epic: '008'
  sprint: '01'
  title: The pypi environment needs required reviewers and a matching PyPI trusted-publisher claim
  source: sprint closure — redteam M3
  severity: Medium
  status: backlog
  description: "release.yaml's publish-package-pypi now declares environment: pypi. That declaration is safe to land alone -- PyPI checks only the constraints its trusted publisher declares, so an unconstrained publisher keeps working, and an environment with no protection rules runs exactly as before -- but it protects nothing yet. Two settings outside the tree finish it: (1) required reviewers on the pypi environment, which is the only place a human can be put in front of an upload PyPI never allows to be withdrawn or replaced; (2) the PyPI trusted publisher constrained to that environment claim, without which ANY workflow in this repository that can obtain id-token: write can mint a PyPI-scoped token, not only the reviewed one. (2) costs nothing operationally and closes the larger half on its own; (1) means every stable release waits for a human, which is the trade to decide. test_the_irrevocable_destination_names_an_environment asserts the declaration and states plainly that it cannot see either setting. Recorded in docs/operational.md."
- key: BL-E008-009
  epic: '008'
  sprint: '01'
  title: The vendored .agents/.claude trees are claimed to match an installed BMad release and nothing checks it
  source: sprint closure — redteam M6
  severity: Low
  status: backlog
  description: "docs/guidelines.md describes .agents/ and .claude/ as vendored BMad skills 'this project neither authors nor maintains'. That is a checkable claim and it is unchecked: 1,229 tracked files that any pull request can edit, excluded from every linting gate by .pre-commit-config.yaml's exclude and from the secret scanner by .gitleaks.toml's allowlist, in a repository whose agents hold write access and are instructed to read them and follow their directions exactly. Sprint closure addressed the review half by adding them to CODEOWNERS. The integrity half remains: a guard asserting the trees are byte-identical to the release they claim to vendor. Deliberately not done in closure -- it needs a source of truth for 'the installed release' that does not exist in the repo yet, and inventing one would be worse than the gap."
