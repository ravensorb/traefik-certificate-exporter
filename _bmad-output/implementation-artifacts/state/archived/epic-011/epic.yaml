retrospective:
  summary: 4 stories closed into S01 with 2 fix iterations; sprint closure found 56 findings (28 fixed, 30 deferred) across 4 reviewers; epic closure then found 2 Major drift findings (undocumented SIGTERM routing + TOCTOU cancel() fix; undocumented RCE-closing logging.yaml auto-discovery removal) and 1 High + 2 Medium security findings (misleading Docker-socket privilege docs; unenforced /config writability invariant; unsanitized log interpolation), all resolved before close. 2 Low issues promoted to Medium given full-epic context.
  learnings: 1) Hardening a trust boundary's write side is incomplete without hardening what reaches it unvalidated. 2) Shutdown/signal mechanisms built in a fix pass (not the original diff) are the ones most likely to go undocumented in ADRs. 3) Security findings' looser 'fix in place or ADR-justify' process (vs drift's disposition-tracked one) still benefits from the same independent-verification discipline before acceptance.
