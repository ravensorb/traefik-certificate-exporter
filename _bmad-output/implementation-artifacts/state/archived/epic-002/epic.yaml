retrospective:
  summary: '5/5 stories done in one sprint, no carry-over. Real docker build+run verification (not just diff review) caught and fixed two real defects: a dead base-image tag and a confuse/Python 3.14 incompatibility.'
  learnings: Real build+run verification catches defects static Dockerfile review cannot (dead base image tags, runtime library incompatibilities from base-image upgrades); a venv's console-script shebangs bake in the build-time path, so multi-stage Docker builds must create the venv at its final destination path; never run pre-commit --all-files with mutating hooks (ruff-check/ruff-format) on an existing repo.
