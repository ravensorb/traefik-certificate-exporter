retrospective:
  summary: "3/3 stories done in one sprint, no carry-over. Writing the first real tests surfaced 2 pre-existing defects (both scoped to the optional Docker restart feature, never affecting cert export to disk) -- fixed and regression-tested. A separate config-precedence change was retracted: it was based on the agent's own undocumented assumption, not a confirmed requirement; the maintainer confirmed the original CLI>env>file>default order was correct and already working in production."
  learnings: Module-level singletons parsing sys.argv at import time are untestable from any host but the console script; confuse precedence is later-source-wins and the confirmed correct order here is CLI>env>file>default (env vars outrank the config file for this Docker-first tool); before 'fixing' code to match documentation, verify the documentation wasn't itself written during the same work and never independently confirmed.
