retrospective:
  summary: 'E014 delivered all 17 stories across two sprints and shipped 0.3.0 to PyPI, Docker Hub (0.3.0/0.3/latest) and Gitea, from GitHub release run 38281339396 and a local-act Gitea publish; a live-host test against production ACME data produced the same certificates as 0.2.0. The recurring weakness was evidence quality, not product quality: five done stories carry tests_passing false because of how runs are recorded, flat estimates did not distinguish stories, and the sprint-01 action for a pm-status expected-failure mode was still open at epic end. Epic closure found the release topology departed from CI spine AD-9/AD-10 (two image digests for 0.3.0, no GHCR, no forge release) and a HIGH privilege-drop gap on /config (RT-1); both are deferred to E015 0.3.1 with BL-E014-105..108. Accepted with open items.'
  learnings: "- Keep tests_passing meaningful: pm-status needs an expected-failure mode (5 of 17 done stories read as failing).\n- Run every story verification row against the tree before committing the story; broken rows became permanent red evidence.\n- Check the spine's adopted mechanisms before writing a guard (first BL-E014-075 guard was a forbidden pytest).\n- End-to-end dry runs and a live-host parallel test found defects unit gates could not; also verify the release lands from one run with one digest (AD-1).\n- Flat per-story estimates hid 0.27x-5.4x elapsed variance; ADR-bearing and act/forge dry-run stories need their own weighting."
