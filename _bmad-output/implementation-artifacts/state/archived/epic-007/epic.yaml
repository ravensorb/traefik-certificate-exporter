retrospective:
  summary: 'E007 delivered a reproducible build and verification foundation in one sprint: a just/Bake local facade over a fail-closed exact-wheel image build, a guarded release transaction, versioned publication-evidence contracts, and a secret-free reusable verifier producing one provable promotable artifact set. Closure found 10 MAJOR architectural findings and resolved all of them. The delivery was later destroyed and restored; closure artifacts are lost and this state is reconstructed. See epic-closure/closure-report.md.'
  learnings: "1) Derive a guard's scope from the source of truth, then attack the scope rather than only the rule -- this defect appeared six times across the epic, twice in guards written the same day. 2) A guard that greps a whole file will be satisfied by the comment explaining the guard. 3) Frequent commits are not a backup: they live inside the directory a destructive tool deletes, so work must exist off the machine. 4) Never hand a container write access to the repository root. 5) Prove a new gate with a planted violation, never a green run -- pre-commit --all-files skips untracked files and will report green over nothing."
