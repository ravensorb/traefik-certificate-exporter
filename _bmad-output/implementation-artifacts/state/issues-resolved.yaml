- key: BL-E008-008
  epic: '008'
  sprint: '01'
  title: The pypi environment needs required reviewers and a matching PyPI trusted-publisher claim
  source: sprint closure — redteam M3
  severity: Low
  amended: 'Split at E008 closure on the maintainer''s decision. (1) REQUIRED REVIEWERS: declined -- sole-developer project, so a human approval gate is a gate on yourself. Not revisited unless a second committer joins. (2) BINDING THE PYPI TRUSTED PUBLISHER TO THE `pypi` ENVIRONMENT CLAIM: still open, and it is not a process gate -- it costs nothing operationally, adds no approval and no waiting. It narrows which workflow can mint a PyPI-scoped OIDC token from `any workflow in this repository that can obtain id-token: write` to one. Latent today because PUBLISH_PACKAGE_PYPI is unset, so PyPI publication is disabled: the trigger is the first time PyPI is enabled, and it should be done in the same sitting rather than after. Severity lowered to Low on that basis. The `environment: pypi` declaration is already in release.yaml and is inert until the PyPI side is configured.'
  status: resolved
  description: "release.yaml's publish-package-pypi now declares environment: pypi. That declaration is safe to land alone -- PyPI checks only the constraints its trusted publisher declares, so an unconstrained publisher keeps working, and an environment with no protection rules runs exactly as before -- but it protects nothing yet. Two settings outside the tree finish it: (1) required reviewers on the pypi environment, which is the only place a human can be put in front of an upload PyPI never allows to be withdrawn or replaced; (2) the PyPI trusted publisher constrained to that environment claim, without which ANY workflow in this repository that can obtain id-token: write can mint a PyPI-scoped token, not only the reviewed one. (2) costs nothing operationally and closes the larger half on its own; (1) means every stable release waits for a human, which is the trade to decide. test_the_irrevocable_destination_names_an_environment asserts the declaration and states plainly that it cannot see either setting. Recorded in docs/operational.md."
  resolution: deferred
  resolved_at: '2026-10-06T18:41:53Z'
  note: "Reconciliation 2026-10-06 (E011-S01-001 review): already fully decided and documented at E008 closure (commit e064f16, 2026-09-03). Required reviewers: declined (sole-developer project). Trusted-publisher environment claim: accepted but latent, trigger recorded as 'first time PyPI publishing is enabled' -- an external GitHub/PyPI settings change, not a repo code/doc change. docs/operational.md lines 220-246 already document both decisions in full. Nothing left for this repo to build; correctly deferred to that future trigger, not promoted into a story."
