- key: BL-E013-041
  epic: '013'
  sprint: '02'
  title: Dropped privileges make Traefik's acme.json unreadable by default; exporter silently exports nothing
  source: maintainer-review
  severity: High
  status: resolved
  description: "Traefik writes acme.json 0600 and refuses to start if group/other bits are set (pkg/provider/acme/local_store_unix.go CheckFile: mode&0o077 != 0 -> 'too open, please use 600'); Traefik runs as root by default, so acme.json is root:root 0600. ADR-0030 drops the service to abc whenever settings.restartcontainers is off, so the core function (reading the ACME store) fails with only an init WARNING, whose remedy 'relax their group permissions' is impossible under Traefik's check. Maintainer decision 2026-10-10: option A — drop privileges only when every matching ACME store file exists and is readable by the service account; otherwise run as root with a WARNING naming why and how to avoid it (run Traefik as a non-root user and set PUID/PGID to its uid/gid). Amend ADR-0030. Blocks the 0.3.0 release."
  story: E013-S02-004
  scheduled_at: '2026-10-10T20:09:40Z'
  resolution: fixed
  resolved_at: '2026-10-10T20:38:16Z'
  ref: E013-S02-004
