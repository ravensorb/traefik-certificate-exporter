- key: BL-E009-003
  epic: '009'
  sprint: ''
  title: The spine's protected-credentials table promises Gitea a scoped PyPI/TestPyPI token the code does not implement
  source: E009 arch gate — MAJOR
  severity: Low
  status: resolved
  description: The spine's Protected-credentials table describes a scoped token for PyPI and TestPyPI on Gitea. The shipped code deliberately marks both destinations 'unsupported' whenever FORGE != github (release.yaml, dev.yaml), by host capability rather than by toggle, and provides no token path at all. The code is right -- capability divergence is exactly how ADR-0011 s2 says absent destinations must be reported -- and the table is stale. It matters because story 001's DoD and story 002's 'required package channels' are both written against the table rather than against the code, so E009 would set out to certify a channel that does not exist. Correct the table when E009 resumes.
  resolution: obsolete
  resolved_at: '2026-10-06T17:28:51Z'
  note: "Verified against current ARCHITECTURE-SPINE.md: the Protected-credentials table already marks TestPyPI/PyPI unsupported on Gitea with no credential path (matches dev.yaml/release.yaml), and CI-AR6/CI-AR25/CI-AR34/CI-AR38 already carry the corrections review-reality.md R1/R3/R4 required. The table was stale when filed but was already fixed by a prior session pass; additionally annotated the remaining 'certified by E009' table cells with 2026-10-06 rescope-deferred language so they stay accurate after the rescope."
- key: BL-E009-002
  epic: '009'
  sprint: ''
  title: AUTHORITY_SCOPES covers 4 of GitHub's ~15 permission scopes, so a permissive runner still grants the rest
  source: E009 arch gate — MAJOR
  severity: Medium
  status: resolved
  description: "E008 made every credential-bearing job declare contents, packages, id-token and attestations explicitly, including the denials, because Gitea does not document GitHub's deny-by-default reading and ships TokenPermissionMode permissive. That closes four scopes. GitHub declares roughly fifteen -- actions, checks, deployments, discussions, issues, models, pages, pull-requests, repository-projects, security-events, statuses, artifact-metadata -- and under a permissive runner every one of them still grants on every one of those jobs. The four chosen are the ones the authority split depends on, so the choice was not arbitrary, but the residual is real and is bounded by nothing. Gitea's code:/releases: vocabulary also does not map one-to-one onto GitHub's, so 'declare them all' is not simply a longer list. Decide the intended posture before E009 certifies the split: enumerate every scope, or record why four is the boundary."
  resolution: fixed
  resolved_at: '2026-10-06T17:28:56Z'
  ref: E009-S01-001
  note: "Resolved by recording the four-scope boundary rationale in docs/adr/0019 (Permission-scope boundary, 2026-10-06): the 4 declared scopes are a complete enumeration of this repo's authority on GitHub (deny-by-default for unlisted scopes); the Gitea TokenPermissionMode=permissive residual is a live-instance property out of scope under the E009 rescope, re-open only if this project is ever operated against a real Gitea instance."
