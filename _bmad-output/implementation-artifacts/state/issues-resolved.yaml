  ref: E009-S01-002
  note: Added the required Mermaid sequence diagram (certification gate -> ADR-0016 closure comparison -> ADR-0020 recovery contract -> production-owner cutover -> rollback) to docs/ci/gitea-certification.md, tying each branch to its concrete stop condition and mechanical check. Documentation-only; no live Gitea needed.
- key: BL-E009-001
  epic: '009'
  sprint: ''
  title: Run the adversarial pass per story in E009, not only at sprint closure
  source: epic closure — E008 retrospective follow-through
  severity: Medium
  status: resolved
  description: "The per-story loop runs bmad-code-review only; adversarial, red-team and arch-drift run at sprint closure. In E008 that meant a defect written in story 001 was found after 002, 003 and 004 had copied its shape -- one finding, four times, with three stories built on top of it. Closure remediation was 24 commits against 3 implementation commits, and roughly half the epic's man-hours landed in the closure band. There is no customize.toml knob for this: it is an orchestration choice made at dispatch time, so it has to be remembered rather than configured, which is why it is an issue rather than a setting. Recorded in docs/project-context.md alongside the rest of E008's process learnings. E009 adds guards to the same surface, so the multiplier applies again."
  resolution: deferred
  resolved_at: '2026-10-06T17:32:25Z'
  note: "This is a standing cross-epic orchestration-process guideline, not a defect in E009's own artifacts: already recorded in docs/project-context.md section 1 ('Run the adversarial pass per story, not per sprint'). E009's own two stories did not reproduce E008's copied-defect pattern (9 fix iterations total across both stories, no cross-story shape repeated), so there is nothing to retroactively fix in this now-closed epic. Deferred as a dispatch-time practice to apply at the next CONFIG/complex epic, not reopened against E009."
- key: BL-E009-004
  epic: '009'
  sprint: ''
  title: E009's estimate has no allowance for first-forge execution, and its closure ratio contradicts the sprint's
  source: E009 arch gate — MAJOR
  severity: Medium
  status: resolved
  description: E009 is estimated at 28.81-29.90 man-hours with 0.17-0.18 HITL hours, for an epic whose deliverable is a physical deployment against hardware nobody has run this pipeline on. docs/project-context.md section 8 records that six CI runs against a pipeline six review phases had already cleared produced five statically-invisible defects, and section 2 that E008 actualled 210 man-hours against 74.6-77.4. Neither is reflected. Separately the epic node's closure_ratios.man_hours is 0.2587 while the sprint node's is 1.8449 -- the same metric an order of magnitude apart on parent and child, which will mis-train calibration whichever is used. Re-estimate before execution, and reconcile the two ratios.
  resolution: deferred
  resolved_at: '2026-10-06T17:32:25Z'
  note: "Partially addressed during planning: the epic was re-estimated mid-session to 90.18-99.80 man-hours (from 28.81-29.90), explicitly correcting the original 'no first-forge allowance' complaint before execution. Post-rescope actuals are now recorded at every level (story/sprint/epic: 13 actual man-hours total, reflecting the dropped live-infra scope). The residual complaint -- epic-level closure_ratios.man_hours (0.7656) still differing materially from sprint-level (3.3513) -- persists, but tracing pm-status.py's rollup_parent_estimate/active_closure_ratio shows this is calibrated per-level against that level's own historical closure population by design, not a hand-editable data-entry error. Whether independent per-level calibration populations should diverge this much is a pm-status.py methodology question, out of scope for a project-level backlog item; deferred to the planning-tool's own maintainers rather than resolved by editing this epic's state files."
