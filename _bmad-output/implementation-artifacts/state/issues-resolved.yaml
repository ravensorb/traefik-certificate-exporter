  sprint: ''
  title: No correlation identifier joins a watch event to its drain pass, export and notification
  source: epic-010 architecture gates
  severity: Medium
  status: resolved
  description: "Raised by both Epic 10 gates against core §9, which requires a trace id propagating across every boundary including sync->async. The hops exist today (watchdog event -> threading.Timer thread -> export -> post-export subprocess) and E010-S01-002 adds a fourth. An operator asking 'why did I get no notification for acme-dns.json' has no join key between the event line, the drain and the delivery result. Compounded by the container profile: docker/Dockerfile sets LOGGING_CONSOLEONLY=true, which selects the coloredlogs formatter, so records are strings rather than fields. Suggested shape: a per-drain pass id in a contextvars variable, emitted as a field, plus the JSON formatter for the container console handler."
