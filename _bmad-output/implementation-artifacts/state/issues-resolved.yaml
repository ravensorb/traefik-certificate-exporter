  note: "Implemented the correlation identifier: resolve_certification_report() now requires every required case's row to share one tuple_fingerprint (one certification attempt = one pinned tuple, ADR-0015), rejecting an export assembled from more than one attempt even when each row individually matches its own retained record. New test: test_an_export_mixing_two_tuple_fingerprints_fails_resolution. Documented in docs/adr/0017 and docs/ci/gitea-certification.md. Fully static; no live Gitea needed."
