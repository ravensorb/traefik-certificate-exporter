  sprint: ''
  title: pre-commit --all-files silently skips untracked files, and this has now caused a false green twice
  source: post-restore audit
  severity: Medium
  status: resolved
  description: 'pre-commit --all-files enumerates git ls-files, so any gate reports green over a set that excludes untracked work. This first appeared when the whole E007 delivery was untracked and every gate skipped it. It recurred on 2026-09-01 against a brand-new mypy gate: the gate passed a deliberately planted type error because src/publication_contract/ had not been staged. It recurred a third time on 2026-09-04 during the BL-E008-010 split: tests/ci/test_gates.py was written, run green under `pre-commit run --all-files`, and shipped with an undefined `Any` -- the file was untracked, so ruff never read it. Three times the gate looked green while checking nothing, and each time the file at fault was new. There is no mechanical guard for this -- the practical rule is to `git add` before trusting an --all-files result, and to prove any new gate with a planted violation rather than a green run. Worth considering a repo-level check that fails when tracked-vs-untracked coverage diverges.'
  story: E011-S01-002
  scheduled_at: '2026-10-06T18:18:07Z'
  resolution: fixed
  resolved_at: '2026-10-06T19:57:28Z'
  ref: E011-S01-002
