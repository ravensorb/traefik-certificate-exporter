findings:
  SD-01-1:
    severity: MAJOR
    title: ADR-0037 records that `useDefault = true` inherits gitleaks' default global allowlist. That allowlist skips `.git`, `poetry.lock`, `.gitleaks.toml`, `.venv/lib/python3.x` and `.poetry/plugins/*`, so a credential in `poetry.lock` or `.gitleaks.toml` is not reported. Only ADR-0033's amendment, `.gitleaks.toml` and `docs/developer.md` were corrected. The binding spine, ADR-0035 and the walkthrough's "What polices the pipeline" table still assert the opposite of the shipped behaviour. This is the same false claim AG-12 was raised for.
    disposition: resolved-in-code
    spec:
    adr:
    commit:
    issue:
  SD-01-2:
    severity: MAJOR
    title: "Deleting `tests/ci/` turned three hard rules back into review-only prose: no `paths` allowlist (the RT-008 red-team fix), no `ref:`/`repository:` on any checkout (AD-6, ADR-0028), and no `ACT` in workflows (AD-6). The docs say this honestly, but global rule 3 allows review-only enforcement only when a rule *cannot* be checked mechanically. Each of these is a one-line regex that pre-commit's built-in `language: pygrep` checks with no repository code, which AD-4 permits (\"standard tools' configuration\"). zizmor and actionlint check none of them."
    disposition: resolved-in-code
    spec:
    adr:
    commit:
    issue:
  SD-01-3:
    severity: MAJOR
    title: The overlay requires the BuildKit flags `--sbom=true --provenance=true`, which `build-push-action` exposes as the `sbom` and `provenance` inputs. The spine defers "build provenance attestations / SBOM" as "GitHub-only (needs OIDC)". That reason applies to GitHub's artifact-attestation service, not to BuildKit attestations, which are produced by BuildKit itself on any builder. So the deferral rests on a reason that does not apply. Whether the Gitea container registry accepts attestation manifests has not been verified.
    disposition: spec-proposal
    spec: _bmad-output/planning-artifacts/architecture/architecture-ci-cd-pipeline-2026-10-08/ARCHITECTURE-SPINE.md#deferred
    adr:
    commit:
    issue:
  SD-01-4:
    severity: MINOR
    title: Each of these contradicts a later decision. ADR-0036 §5 says a re-run produces a new digest. The spine's Stack and Deferred sections pin upload-artifact v5.0.0 and download-artifact v6.0.0 because act 0.2.89 rejects newer majors. ADR-0036 §1 puts the version guard before the CA import, and the workflows match ADR-0036.
    disposition: resolved-in-code
