# zizmor pin policy (AD-5 as amended by ADR-0036). Configures unpinned-uses only and
# disables no audit; accepted findings are suppressed per line, never per audit.
# `ref-pin` accepts any ref, branch or tag: `LiquidLogicLabs/x@main` passes as readily as
# `@v2` (checked against zizmor 1.30.1). The major-tag form `@vN` AD-5 asks for is enforced
# by the `workflows-lll-major-tag` pygrep hook in .pre-commit-config.yaml (F-07).
rules:
  unpinned-uses:
    config:
      policies:
        "LiquidLogicLabs/*": ref-pin
        "*": hash-pin
