name: Build and publish python package

# Trigger behaviour is deliberately unchanged: PyPI publication is not configured for
# this project yet, and running this workflow on push previously corrupted
# pyproject.toml's version. Only the action supply chain was remediated.
on:
  workflow_call:
  release:
    types: [ published ]

# Read-only is sufficient now that publication no longer runs a version-bump commit
# back into the repository -- that write path is what corrupted tool.poetry.version.
permissions:
    contents: read

env:
    # pypa/gh-action-pypi-publish's repository-url expects a full upload-endpoint URL,
    # not a registry keyword -- default to TestPyPI (safer than the real PyPI index
    # while this pipeline is unverified end-to-end); override via the PACKAGE_REPO
    # repo variable once ready to publish for real.
    PACKAGE_REPO: ${{ vars.PACKAGE_REPO || 'https://test.pypi.org/legacy/' }}
    GITHUB_TAG: ${{ vars.RELEASE_GITHUB_TAG || '' }}
    PYTHON_VERSION: ${{ vars.PYTHON_VERSION || '3.11' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository # You must checkout your repository first.
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pinned Python and Poetry
        uses: ./.github/actions/setup-poetry-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          dependencies: none

      - name: Build wheel and sdist
        run: poetry build

      - name: Publish PyPi package
        uses: pypa/gh-action-pypi-publish@v1
        with:
          user: ${{ secrets.PYPI_USERNAME }}
          password: ${{ secrets.PYPI_TOKEN }}
          repository-url: ${{ env.PACKAGE_REPO }}
          packages-dir: dist
