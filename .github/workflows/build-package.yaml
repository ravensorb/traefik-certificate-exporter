name: Build and publish python package

on:
  workflow_call:
  release:
    types: [ published ]

permissions:
    contents: write

env:
    # cadifyai/poetry-publish's PUBLISH_REGISTRY expects a full upload-endpoint URL,
    # not a registry keyword -- default to TestPyPI (safer than the real PyPI index
    # while this pipeline is unverified end-to-end); override via the PACKAGE_REPO
    # repo variable once ready to publish for real.
    PACKAGE_REPO: ${{ vars.PACKAGE_REPO || 'https://test.pypi.org/legacy/' }}
    GITHUB_TAG: ${{ vars.RELEASE_GITHUB_TAG || '' }}
    PYTHON_VERSION: ${{ vars.PYTHON_VERSION || '3.11' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository # You must checkout your repository first.
        uses: actions/checkout@v7
        with:
          # cadifyai/poetry-publish does its own internal checkout (with its own
          # token) further down; leaving credentials persisted here causes a
          # duplicate Authorization header on its git operations (HTTP 400).
          persist-credentials: false

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Publish PyPi package
        uses: cadifyai/poetry-publish@v0.1.1
        with:
          ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHON_VERSION: ${{ env.PYTHON_VERSION }}
          # Package lives under src/, not the repo root -- poetry-publish's version-bump
          # step needs the exact directory containing __init__.py.
          PACKAGE_DIRECTORY: ./src/traefik_certificate_exporter/
          PUBLISH_REGISTRY: ${{ env.PACKAGE_REPO }}
          PUBLISH_REGISTRY_USERNAME: ${{ secrets.PYPI_USERNAME }}
          PUBLISH_REGISTRY_PASSWORD: ${{ secrets.PYPI_TOKEN }}
