name: build-all

on:
  push:
    branches:
      - 'master'
      - 'main'
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  # build-package publishes to PyPI on its own `release: published` trigger
  # (build-package.yaml) -- it isn't wired up here because it isn't ready to run
  # on every push yet (no real tag/version context outside a release event; it
  # previously corrupted pyproject.toml's version when run this way).
  build-container:
    uses: ./.github/workflows/build-container.yaml
    secrets: inherit
