name: build

# Reusable, credential-free build (AD-2): the only place the project is checked, tested,
# built and versioned. Callers pass no secrets and no inputs.
on:
  workflow_call:
    outputs:
      version:
        description: PEP 440 version read from the built wheel (AD-7).
        value: ${{ jobs.build.outputs.version }}
      image-version:
        description: SemVer form of version for image tags (AD-7).
        value: ${{ jobs.build.outputs.image-version }}

permissions:
  contents: read

# Explicit bash: pipefail on every forge's runner, and the arrays below need bash.
defaults:
  run:
    shell: bash

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      image-version: ${{ steps.version.outputs.image-version }}
    steps:
      # Full history and tags: strict dynamic versioning needs a reachable vX.Y.Z (AD-7).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install Poetry and the project
        run: |
          python -m pip install "poetry==2.4.2"
          poetry install

      # The same gates as `just check` (AD-3).
      - name: pre-commit
        run: poetry run pre-commit run --all-files

      - name: pytest
        run: poetry run pytest

      - name: Build wheel and sdist
        run: |
          rm -rf dist
          poetry build
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          if (( ${#wheels[@]} != 1 || ${#sdists[@]} != 1 )); then
            echo >&2 "build: dist/ must hold exactly one wheel and one sdist, found ${#wheels[@]} and ${#sdists[@]}"
            ls -l dist >&2
            exit 1
          fi

      # The only version transform in the repository (AD-7): read the wheel's METADATA,
      # then map PEP 440 `.dev` to SemVer `-dev.` for image tags.
      - name: Read version
        id: version
        run: |
          wheel="$(ls dist/*.whl)"
          version="$(python - "$wheel" <<'PY'
          import email.parser
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as z:
              name = next(n for n in z.namelist() if n.endswith(".dist-info/METADATA"))
              print(email.parser.Parser().parsestr(z.read(name).decode())["Version"])
          PY
          )"
          image_version="${version/.dev/-dev.}"
          wheel_sha256="$(sha256sum "$wheel" | cut -d' ' -f1)"
          echo "version=$version"
          echo "image-version=$image_version"
          echo "wheel=$wheel"
          echo "wheel-sha256=$wheel_sha256"
          {
            echo "version=$version"
            echo "image-version=$image_version"
            echo "wheel-path=$wheel"
            echo "wheel-sha256=$wheel_sha256"
          } >> "$GITHUB_OUTPUT"

      # Uploaded before any ref-pinned (LiquidLogicLabs/*) action runs in this job, so a
      # moved tag cannot alter the dist that dev.yaml and release.yaml publish. A failed
      # smoke test still fails this job, and no publish job runs.
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      # Single-arch smoke image from the exact wheel (AD-17); never pushed.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        # Build records are uploaded as an artifact by default, using a protocol act
        # 0.2.89 rejects (mime_type, nektos/act #6022); nothing consumes them here.
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: traefik-certificate-exporter:build
          build-args: |
            POETRY_VERSION=2.4.2
            WHEEL_PATH=${{ steps.version.outputs.wheel-path }}
            WHEEL_SHA256=${{ steps.version.outputs.wheel-sha256 }}
            VERSION=${{ steps.version.outputs.image-version }}
            REVISION=${{ github.sha }}

      # Inputs (action.yml v2): image (required), timeout, startup-timeout, minimal-env,
      # skip-healthcheck, skip-s6-check, required-services, error-patterns.
      - uses: LiquidLogicLabs/git-action-docker-test@v2
        with:
          image: traefik-certificate-exporter:build
