name: build-all

on:
  push:
    branches:
      - 'master'
      - 'main'
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

permissions:
  contents: read

env:
  # Same interpreter pin the verifier's non-matrix jobs use.
  PYTHON_VERSION: "3.14"

jobs:
  # Sprint S01 deleted test.yaml, which was the only thing running pytest on push to
  # main/master. `plan` + `verify` restore that gate and strengthen it: every push and
  # every v* tag now runs the full governed verifier before anything is built or
  # published. tests/ci/test_workflow_contracts.py asserts this path cannot be removed
  # again without failing CI.
  plan:
    name: Resolve immutable verification inputs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.source.outputs.channel }}
      package-version: ${{ steps.source.outputs.package-version }}
      source-sha: ${{ steps.source.outputs.source-sha }}
    steps:
      - name: Checkout exact pushed source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up pinned Python and Poetry
        id: setup
        uses: ./.github/actions/setup-poetry-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry: "false"
          dependencies: none

      - name: Resolve verification channel, package version, and source SHA
        id: source
        env:
          COMMITTED_VERSION: ${{ steps.setup.outputs.package-version }}
          REF_TYPE: ${{ github.ref_type }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "event source SHA must be a full lowercase Git SHA" >&2
            exit 2
          fi
          if [[ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]]; then
            echo "checked-out source does not match the pushed SHA" >&2
            exit 2
          fi
          if [[ "$REF_TYPE" == "tag" ]]; then
            # A v* tag verifies the committed release identity exactly as a pull
            # request does, with a clean-tree requirement.
            channel="stable"
            package_version="$COMMITTED_VERSION"
          else
            # A branch push verifies a unique, normalized PEP 440 development version
            # derived from the same committed authority. Nothing publishes it; the
            # verifier applies it in its own disposable checkout.
            channel="dev"
            distance="$(git rev-list --count --first-parent HEAD)"
            package_version="$(python scripts/committed_versions.py \
              development-version --distance "$distance")"
          fi
          {
            echo "channel=$channel"
            echo "package-version=$package_version"
            echo "source-sha=$SOURCE_SHA"
          } >> "$GITHUB_OUTPUT"

  verify:
    name: Run governed verifier
    needs: plan
    permissions:
      contents: read
    uses: ./.github/workflows/verify-build.yaml
    with:
      channel: ${{ needs.plan.outputs.channel }}
      package-version: ${{ needs.plan.outputs.package-version }}
      source-sha: ${{ needs.plan.outputs.source-sha }}

  # build-package publishes to PyPI on its own `release: published` trigger
  # (build-package.yaml) -- it isn't wired up here because it isn't ready to run
  # on every push yet (no real tag/version context outside a release event; it
  # previously corrupted pyproject.toml's version when run this way).
  build-container:
    needs: verify
    uses: ./.github/workflows/build-container.yaml
    secrets: inherit
