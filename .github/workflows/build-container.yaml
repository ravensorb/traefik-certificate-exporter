name: build-container

on:
  workflow_call:
    # inputs:
    # secrets:

env:
  DOCKER_PLATFORMS: ${{ vars.DOCKER_PLATFORMS || 'linux/amd64' }}
  DOCKER_PUBLISH_MODE: ${{ vars.DOCKER_PUBLISH_MODE || 'push' }}
  DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY || 'docker.io' }}
  DOCKER_REPONAME: ${{ vars.DOCKER_REPONAME || 'ravensorb' }}
  DOCKER_FILE: ${{ vars.DOCKER_FILE || 'docker/Dockerfile' }}
  DOCKER_IMAGENAME: ${{ vars.DOCKER_IMAGENAME || 'traefik-certificate-exporter' }}
  GIT_REPO_URL: ${{ vars.GIT_REPO || 'https://github.com' }}
  GIT_REPO_OWNER: ${{ vars.GIT_REPO_OWNER || github.repository_owner }}
  GIT_REPO_NAME: ${{ vars.GIT_REPO_NAME || github.event.repository.name }}
  BUILDKIT_FLAGS: ${{ vars.BUILDKIT_FLAGS || '' }}
  GITHUB_TAG: ${{ vars.RELEASE_GITHUB_TAG || '' }}
  HAS_CUSTOM_CA: ${{ secrets.CI_CA_CERTIFICATE != '' }}

jobs:
  build-deploy-container:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: "Set current date as env variable"
        id: builddate  # this is used on variable path
        run: |
          echo "current=$(date +'%Y%m%d%H%M')" >> "$GITHUB_OUTPUT"

      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Get latest tag
        id: tagName
        run: |
          if [ -z "$GITHUB_TAG" ]; then
            echo "name=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"
          else
            echo "name=$GITHUB_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker meta
        id: meta
        uses: LiquidLogicLabs/git-action-docker-metadata@v6
        with:
          # Only one of these is ever active -- mirrors the mutually-exclusive docker.io
          # vs custom-registry "Build and push" steps below, so one metadata computation
          # covers whichever registry is actually configured.
          images: |
            name=${{ env.DOCKER_REPONAME }}/${{ env.DOCKER_IMAGENAME }},enable=${{ env.DOCKER_REGISTRY == 'docker.io' || env.DOCKER_REGISTRY == '' }}
            name=${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPONAME }}/${{ env.DOCKER_IMAGENAME }},enable=${{ env.DOCKER_REGISTRY != 'docker.io' && env.DOCKER_REGISTRY != '' }}
          # latest=auto (the default) tags `latest` only for a real semver release tag,
          # never for a plain branch build -- see the `dev` entry below for that case.
          flavor: |
            latest=auto
          # A tag-triggered (release) build gets only version/major.minor/major/latest --
          # no sha tag mixed in. A branch build gets exactly `dev` (floating) and
          # `dev-<short sha>` (unique per build) -- never a version tag.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=dev,enable=${{ github.ref_type != 'tag' }}
            type=sha,format=short,prefix=dev-,enable=${{ github.ref_type != 'tag' }}
          labels: |
            # org.opencontainers.image.description=
            # org.opencontainers.image.licenses=
            # org.opencontainers.image.title=
            org.opencontainers.image.url=https://${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPONAME }}/${{ env.DOCKER_IMAGENAME }}
            org.opencontainers.image.source=${{ env.GIT_REPO_URL }}/${{ env.GIT_REPO_OWNER }}/${{ env.GIT_REPO_NAME }}
            org.opencontainers.image.version=${{ steps.tagName.outputs.name }}
            org.opencontainers.image.revision=${{ github.sha }}
            # org.opencontainers.image.created=${{ steps.builddate.outputs.current }}
            org.opencontainers.image.authors=${{ env.GIT_REPO_OWNER }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # Runner-agnostic replacement for the old `if: ${{ env.ACT }}` step (which only ever
      # worked under local `act`, via a bind-mounted file that doesn't exist on GitHub or
      # Gitea runners). Conditioned on whether a CI_CA_CERTIFICATE secret is configured --
      # not on which runner this is -- so it behaves identically everywhere: skipped when no
      # secret is set (the common case for this public repo's real GitHub/Gitea runs),
      # applied uniformly when one is (e.g. local `act` runs against a private registry).
      - name: Install custom CA certificate
        if: ${{ env.HAS_CUSTOM_CA == 'true' }}
        uses: LiquidLogicLabs/git-action-ca-certificate-import@v3
        with:
          certificate: ${{ secrets.CI_CA_CERTIFICATE }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-flags: ${{ env.BUILDKIT_FLAGS }}
          platforms: ${{ env.DOCKER_PLATFORMS }}
          use: true

      - name: Login to Docker Hub Registry
        if: github.event_name != 'pull_request' && env.DOCKER_PUBLISH_MODE == 'push' && (env.DOCKER_REGISTRY == 'docker.io' || env.DOCKER_REGISTRY == '')
        uses: docker/login-action@v4
        with:
          logout: false
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Github Registry
        if: github.event_name != 'pull_request' && env.DOCKER_PUBLISH_MODE == 'push' && env.DOCKER_REGISTRY == 'ghcr.io'
        uses: docker/login-action@v4
        with:
          logout: false
          registry: ghcr.io
          username: ${{ secrets.GITHUB_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Custom Registry
        if: github.event_name != 'pull_request' && env.DOCKER_PUBLISH_MODE == 'push' && (env.DOCKER_REGISTRY != 'docker.io' && env.DOCKER_REGISTRY != 'ghcr.io' && env.DOCKER_REGISTRY != '')
        uses: docker/login-action@v4
        with:
          logout: false
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v7
        with:
          # builder: act-builder
          context: .
          file: ${{ env.DOCKER_FILE }}
          platforms: ${{ env.DOCKER_PLATFORMS }}
          push: ${{ env.DOCKER_PUBLISH_MODE == 'push' }}
          load: ${{ env.DOCKER_PUBLISH_MODE != 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # cache-from: type=registry,ref=harbor.ravenwolf.org/my-image:buildcache
          # cache-to: type=registry,ref=harbor.ravenwolf.org/my-image:buildcache,mode=max
          build-args: |
            DEBIAN_FRONTEND: noninteractive
