name: ci

# Pull-request check (AD-1). The required check is `build / build`. No secrets reach the
# reusable build (AD-2); the trigger is the fork-safe pull_request event.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yaml # zizmor: ignore[self-repository] AD-6: GitHub-only $/ syntax; Gitea and act resolve ./ only
