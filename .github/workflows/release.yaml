name: release

# A vX.Y.Z tag publishes a release (AD-1, AD-12). A destination is enabled only when its
# PUBLISH_*_TOKEN secret and every PUBLISH_* variable it needs are set (AD-9); a partly
# configured one is skipped with one warning, an unconfigured one silently. With nothing
# set, the run succeeds and publishes nothing.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

# AD-14 / F-10: at most one release runs and one waits; a running release is never
# cancelled. GitHub keeps one pending run per group, so a newer tag cancels the waiting
# release, and that one must be re-run (`gh run rerun <run-id>`) -- but only while no newer
# tag has released, or it re-points `X.Y` backwards; `latest` is gated on the tag being the
# highest release (validate-tag, AR-3) (docs/ci/pipeline-walkthrough.md "Releasing"). `queue: max` would queue them all, but actionlint v1.7.12 rejects it.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate-tag:
    name: validate-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      is-latest: ${{ steps.latest.outputs.is-latest }}
    steps:
      # Only a plain vX.Y.Z tag releases (AD-12); floating and pre-release tags do not.
      - uses: LiquidLogicLabs/git-action-tag-validate-version@v2
        id: tag
        with:
          tag: ${{ github.ref_name }}
          version-type: regex
          version-regex: '^v\d+\.\d+\.\d+$'

      - name: Reject tag
        if: steps.tag.outputs.is-valid != 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "refusing to release tag $TAG: it must match ^v<major>.<minor>.<patch>$" >&2
          exit 1

      # Full history, ref-free (AD-6): provides refs/remotes/origin/<default branch>.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The tagged commit must be on the default branch (AD-12, ADR-0038). This guards
      # against mistakes only: it runs from the tagged commit, so whoever can push a v* tag
      # can also remove it. The control is forge tag protection on v*.
      - name: Tag is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$DEFAULT_BRANCH" ]; then
            echo "refusing to release tag $TAG: the event payload names no default branch" >&2
            exit 1
          fi
          sha="$(git rev-parse HEAD)"
          echo "tag=$TAG commit=$sha default-branch=$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor HEAD "refs/remotes/origin/$DEFAULT_BRANCH"; then
            echo "refusing to release tag $TAG: commit $sha is not on origin/$DEFAULT_BRANCH" >&2
            exit 1
          fi

      # AR-3: `latest` moves only when this tag is the highest plain vX.Y.Z tag, so a re-run
      # of an older release or a patch on an older line never points `latest` backwards. The
      # workflows-latest-tag-gated pre-commit hook refuses an ungated `latest` line (AD-8).
      - name: Is this the highest release tag
        id: latest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          highest="$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)"
          if [ "$highest" = "$TAG" ]; then is_latest=true; else is_latest=false; fi
          echo "tag=$TAG highest=$highest is-latest=$is_latest"
          echo "is-latest=$is_latest" >> "$GITHUB_OUTPUT"

  build:
    needs: validate-tag
    uses: ./.github/workflows/build.yaml # zizmor: ignore[self-repository] AD-6: GitHub-only $/ syntax; Gitea and act resolve ./ only

  publish-package:
    name: publish-package
    # Publish credentials live only in the release environment (ADR-0039).
    environment: release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Destination flags: a destination is enabled iff its token and every variable it needs
    # are non-empty; ANY_* is true when any of its own inputs is set (AD-9).
    env:
      PUBLISH_CA: ${{ secrets.PUBLISH_CA_CERTIFICATE != '' }}
      PUBLISH_GITEA_PYPI: ${{ secrets.PUBLISH_GITEA_TOKEN != '' && vars.PUBLISH_GITEA_USERNAME != '' && vars.PUBLISH_GITEA_PYPI_URL != '' }}
      ANY_GITEA_PYPI: ${{ vars.PUBLISH_GITEA_PYPI_URL != '' }}
      ANY_GITEA_SHARED: ${{ (secrets.PUBLISH_GITEA_TOKEN != '' || vars.PUBLISH_GITEA_USERNAME != '') && vars.PUBLISH_GITEA_PYPI_URL == '' && vars.PUBLISH_GITEA_REGISTRY == '' && vars.PUBLISH_GITEA_IMAGE == '' }}
      PUBLISH_PYPI: ${{ secrets.PUBLISH_PYPI_TOKEN != '' }}
    steps:
      # Classify each destination from the job-env flags: enabled (one log line), partial
      # (one ::warning::), or unconfigured (silent) (AD-9). It holds no gating rule: the HAS_*
      # presence booleans only name what is missing, and no secret value reaches this step.
      # A list name with no matching flag or HAS_* key is an edit error and fails the step.
      - name: Destination configuration
        env:
          JOB: publish-package
          ENVIRONMENT: release
          # <Destination>|<PUBLISH flag>|<ANY flag>|<required inputs>|<own inputs>|<hint>
          DESTINATIONS: |
            Gitea package index|PUBLISH_GITEA_PYPI|ANY_GITEA_PYPI|secrets.PUBLISH_GITEA_TOKEN vars.PUBLISH_GITEA_USERNAME vars.PUBLISH_GITEA_PYPI_URL|vars.PUBLISH_GITEA_PYPI_URL|
            PyPI|PUBLISH_PYPI||secrets.PUBLISH_PYPI_TOKEN|secrets.PUBLISH_PYPI_TOKEN|
            Gitea shared inputs||ANY_GITEA_SHARED|secrets.PUBLISH_GITEA_TOKEN vars.PUBLISH_GITEA_USERNAME vars.PUBLISH_GITEA_PYPI_URL vars.PUBLISH_GITEA_REGISTRY vars.PUBLISH_GITEA_IMAGE|secrets.PUBLISH_GITEA_TOKEN vars.PUBLISH_GITEA_USERNAME|These are alternatives: vars.PUBLISH_GITEA_PYPI_URL enables the Gitea package index, vars.PUBLISH_GITEA_REGISTRY with vars.PUBLISH_GITEA_IMAGE the Gitea container registry; each also needs secrets.PUBLISH_GITEA_TOKEN and vars.PUBLISH_GITEA_USERNAME.
          # <legacy name>|<replacement, or empty when there is none>
          LEGACY: |
            secrets.DOCKERHUB_TOKEN|secrets.PUBLISH_DOCKERHUB_TOKEN
            secrets.DOCKERHUB_USERNAME|vars.PUBLISH_DOCKERHUB_USERNAME
            secrets.PYPI_TOKEN|secrets.PUBLISH_PYPI_TOKEN
            secrets.PYPI_USERNAME|
            secrets.FORGE_PACKAGE_TOKEN|secrets.PUBLISH_GITEA_TOKEN
            secrets.REGISTRY_USERNAME|vars.PUBLISH_GITEA_USERNAME
            secrets.REGISTRY_PASSWORD|secrets.PUBLISH_GITEA_TOKEN
            secrets.CI_CA_CERTIFICATE|secrets.PUBLISH_CA_CERTIFICATE
            secrets.GITEA_PACKAGE_INDEX_CA_CERTIFICATE|secrets.PUBLISH_CA_CERTIFICATE
            secrets.GITEA_FORGE_API_CA_CERTIFICATE|secrets.PUBLISH_CA_CERTIFICATE
          HAS_PUBLISH_GITEA_TOKEN: ${{ secrets.PUBLISH_GITEA_TOKEN != '' }}
          HAS_PUBLISH_GITEA_USERNAME: ${{ vars.PUBLISH_GITEA_USERNAME != '' }}
          HAS_PUBLISH_GITEA_PYPI_URL: ${{ vars.PUBLISH_GITEA_PYPI_URL != '' }}
          HAS_PUBLISH_PYPI_TOKEN: ${{ secrets.PUBLISH_PYPI_TOKEN != '' }}
          HAS_PUBLISH_GITEA_REGISTRY: ${{ vars.PUBLISH_GITEA_REGISTRY != '' }}
          HAS_PUBLISH_GITEA_IMAGE: ${{ vars.PUBLISH_GITEA_IMAGE != '' }}
          HAS_DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
          HAS_DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME != '' }}
          HAS_PYPI_TOKEN: ${{ secrets.PYPI_TOKEN != '' }}
          HAS_PYPI_USERNAME: ${{ secrets.PYPI_USERNAME != '' }}
          HAS_FORGE_PACKAGE_TOKEN: ${{ secrets.FORGE_PACKAGE_TOKEN != '' }}
          HAS_REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME != '' }}
          HAS_REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD != '' }}
          HAS_CI_CA_CERTIFICATE: ${{ secrets.CI_CA_CERTIFICATE != '' }}
          HAS_GITEA_PACKAGE_INDEX_CA_CERTIFICATE: ${{ secrets.GITEA_PACKAGE_INDEX_CA_CERTIFICATE != '' }}
          HAS_GITEA_FORGE_API_CA_CERTIFICATE: ${{ secrets.GITEA_FORGE_API_CA_CERTIFICATE != '' }}
        run: |
          defined() { [ -n "${!1+x}" ] || { echo "::error title=$JOB::Destination configuration: $1 is not defined (list edit error)"; exit 1; }; }
          has() { local v="HAS_${1#*.}"; defined "$v"; [ "${!v}" = true ]; }
          join() { local IFS=,; local s="$*"; echo "${s//,/, }"; }
          where="Set them as $ENVIRONMENT environment secrets/variables (GitHub) or repository Actions secrets/variables (Gitea)"
          while IFS='|' read -r dest publish any inputs own hint; do
            [ -n "$dest" ] || continue
            for flag in $publish $any; do defined "$flag"; done
            if [ -n "$publish" ] && [ "${!publish}" = true ]; then
              echo "$dest enabled"
            elif [ -n "$any" ] && [ "${!any}" = true ]; then
              missing=(); set_own=()
              for input in $inputs; do has "$input" || missing+=("$input"); done
              for input in $own; do if has "$input"; then set_own+=("$input"); fi; done
              echo "::warning title=$JOB::$dest partially configured, skipped: missing $(join "${missing[@]}"). $where, or unset $(join "${set_own[@]}") to disable it.${hint:+ $hint}"
            fi
          done <<< "$DESTINATIONS"
          found=()
          while IFS='|' read -r old new; do
            [ -n "$old" ] || continue
            if has "$old"; then found+=("$old (${new:+now }${new:-no replacement})"); fi
          done <<< "$LEGACY"
          if (( ${#found[@]} )); then
            echo "::warning title=$JOB::Legacy settings found, no longer read: $(join "${found[@]}"). Move each value to its replacement (docs/ci/pipeline-walkthrough.md, \"Where things are published\"), then delete the legacy name."
          fi

      # The built version must be the pushed tag's (AD-12).
      - name: Version guard
        env:
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          [ "$VERSION" = "${TAG#v}" ] || { echo "refusing to publish $VERSION from tag $TAG" >&2; exit 1; }

      # Ref-free (AD-6); before download, which checkout would otherwise clean.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: dist
          path: dist/

      # The dist is byte-identical to what build hashed (AD-17, BL-E013-021); before the CA
      # import and every login or upload, so a tampered artifact meets no credential (AD-18).
      - name: Verify dist hashes
        id: verify
        env:
          WHEEL_SHA256: ${{ needs.build.outputs.wheel-sha256 }}
          SDIST_SHA256: ${{ needs.build.outputs.sdist-sha256 }}
        run: |
          shopt -s nullglob dotglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          entries=(dist/*)
          # Uploads send dist/*, so nothing beside the two hashed files may be there.
          if (( ${#wheels[@]} != 1 || ${#sdists[@]} != 1 || ${#entries[@]} != 2 )); then
            echo >&2 "verify: dist/ must hold exactly one wheel and one sdist and nothing else, found ${#entries[@]} entries:"
            ls -la dist >&2
            exit 1
          fi
          bad=0
          for output in wheel-sha256 sdist-sha256; do
            var="${output%%-*}"; var="${var^^}_SHA256"
            if ! [[ "${!var}" =~ ^[0-9a-f]{64}$ ]]; then
              echo >&2 "verify: needs.build.outputs.${output} is not a 64-hex SHA-256: '${!var}'"
              bad=1
            fi
          done
          (( bad == 0 )) || exit 1
          echo "${wheels[0]}: expected $WHEEL_SHA256 computed $(sha256sum "${wheels[0]}" | cut -d' ' -f1)"
          echo "${sdists[0]}: expected $SDIST_SHA256 computed $(sha256sum "${sdists[0]}" | cut -d' ' -f1)"
          printf '%s  %s\n' "$WHEEL_SHA256" "${wheels[0]}" "$SDIST_SHA256" "${sdists[0]}" | sha256sum -c -
          echo "wheel-path=${wheels[0]}" >> "$GITHUB_OUTPUT"

      # Private CA for runner and twine (AD-18).
      - uses: LiquidLogicLabs/git-action-ca-certificate-import@v3
        id: ca
        if: env.PUBLISH_CA == 'true'
        with:
          certificate: ${{ secrets.PUBLISH_CA_CERTIFICATE }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # Hash-checked Poetry, then only the locked publish group -- twine, no dev toolchain
      # beside the token (AD-11). Strict versioning resolves from this job's full-history,
      # tagged checkout (AD-7); the uploaded version is the dist wheel's (AD-2).
      - name: Install twine
        run: | # zizmor: ignore[use-trusted-publishing] AD-11: installs the publish group, uploads nothing
          python -m pip install --require-hashes -r .github/requirements/poetry.txt
          poetry install --only publish --no-root

      - name: Upload to Gitea
        if: env.PUBLISH_GITEA_PYPI == 'true'
        env:
          REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
          REPOSITORY_URL: ${{ vars.PUBLISH_GITEA_PYPI_URL }}
          TWINE_USERNAME: ${{ vars.PUBLISH_GITEA_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PUBLISH_GITEA_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        # twine refuses --skip-existing for any index but PyPI/TestPyPI
        # (UnsupportedConfiguration), so a re-run is kept safe here by asking Gitea which of
        # this version's files it already holds and uploading only the missing ones (AD-11).
        run: |
          base="${REPOSITORY_URL%/api/packages/*}"
          rest="${REPOSITORY_URL#*/api/packages/}"
          owner="${rest%%/*}"
          wheel="$(basename dist/*.whl)"
          name="${wheel%%-*}"
          name="${name//_/-}"
          files_url="$base/api/v1/packages/$owner/pypi/$name/$VERSION/files"
          # F-09 / AD-11: the header goes to curl on stdin (`@-`), never on argv, where `ps`
          # and /proc/<pid>/cmdline would show it; printf is a bash builtin, so it is not exec'd.
          code="$(printf 'Authorization: token %s\n' "$TWINE_PASSWORD" | curl -sS -o existing.json -w '%{http_code}' -H @- "$files_url")"
          case "$code" in
            200) ;;
            404) echo '[]' > existing.json ;;
            *) echo "Upload to Gitea: unexpected HTTP $code from $files_url" >&2; exit 1 ;;
          esac
          pending=()
          for file in dist/*; do
            if ! jq -e --arg n "$(basename "$file")" 'any(.[]; .name == $n)' existing.json > /dev/null; then
              pending+=("$file")
            fi
          done
          if [ "${#pending[@]}" -eq 0 ]; then
            echo "Gitea already holds every file of $name $VERSION; nothing to upload"
            exit 0
          fi
          poetry run twine upload --non-interactive --repository-url "$REPOSITORY_URL" "${pending[@]}"

      - name: Upload to PyPI
        if: env.PUBLISH_PYPI == 'true'
        env:
          REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
          REPOSITORY_URL: https://upload.pypi.org/legacy/
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PUBLISH_PYPI_TOKEN }}
        run: poetry run twine upload --non-interactive --skip-existing --repository-url "$REPOSITORY_URL" dist/*

  publish-image:
    name: publish-image
    # Publish credentials live only in the release environment (ADR-0039).
    environment: release
    needs: [validate-tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # the job's own token pushes to GHCR on GitHub (ADR-0052)
    # Destination flags (AD-9: token and every variable non-empty; ANY_* = any own input set;
    # GHCR needs only its image and falls back to the job's own token on github.com only,
    # since a Gitea job token cannot push to ghcr.io),
    # the one combined flag, and the image names (and the Gitea registry host) of enabled
    # registries only (AD-10, AD-18).
    env:
      PUBLISH_CA: ${{ secrets.PUBLISH_CA_CERTIFICATE != '' }}
      PUBLISH_GHCR: ${{ vars.PUBLISH_GHCR_IMAGE != '' && (secrets.PUBLISH_GHCR_TOKEN != '' || (github.server_url == 'https://github.com' && github.token != '')) }}
      ANY_GHCR: ${{ secrets.PUBLISH_GHCR_TOKEN != '' || vars.PUBLISH_GHCR_USERNAME != '' || vars.PUBLISH_GHCR_IMAGE != '' }}
      PUBLISH_GITEA: ${{ secrets.PUBLISH_GITEA_TOKEN != '' && vars.PUBLISH_GITEA_USERNAME != '' && vars.PUBLISH_GITEA_REGISTRY != '' && vars.PUBLISH_GITEA_IMAGE != '' }}
      ANY_GITEA: ${{ vars.PUBLISH_GITEA_REGISTRY != '' || vars.PUBLISH_GITEA_IMAGE != '' }}
      PUBLISH_DOCKERHUB: ${{ secrets.PUBLISH_DOCKERHUB_TOKEN != '' && vars.PUBLISH_DOCKERHUB_USERNAME != '' && vars.PUBLISH_DOCKERHUB_IMAGE != '' }}
      ANY_DOCKERHUB: ${{ secrets.PUBLISH_DOCKERHUB_TOKEN != '' || vars.PUBLISH_DOCKERHUB_USERNAME != '' || vars.PUBLISH_DOCKERHUB_IMAGE != '' }}
      PUBLISH_IMAGE: ${{ (vars.PUBLISH_GHCR_IMAGE != '' && (secrets.PUBLISH_GHCR_TOKEN != '' || (github.server_url == 'https://github.com' && github.token != ''))) || (secrets.PUBLISH_GITEA_TOKEN != '' && vars.PUBLISH_GITEA_USERNAME != '' && vars.PUBLISH_GITEA_REGISTRY != '' && vars.PUBLISH_GITEA_IMAGE != '') || (secrets.PUBLISH_DOCKERHUB_TOKEN != '' && vars.PUBLISH_DOCKERHUB_USERNAME != '' && vars.PUBLISH_DOCKERHUB_IMAGE != '') }}
      GHCR_IMAGE: ${{ vars.PUBLISH_GHCR_IMAGE != '' && (secrets.PUBLISH_GHCR_TOKEN != '' || (github.server_url == 'https://github.com' && github.token != '')) && vars.PUBLISH_GHCR_IMAGE || '' }}
      GITEA_IMAGE: ${{ secrets.PUBLISH_GITEA_TOKEN != '' && vars.PUBLISH_GITEA_USERNAME != '' && vars.PUBLISH_GITEA_REGISTRY != '' && vars.PUBLISH_GITEA_IMAGE != '' && vars.PUBLISH_GITEA_IMAGE || '' }}
      GITEA_REGISTRY: ${{ secrets.PUBLISH_GITEA_TOKEN != '' && vars.PUBLISH_GITEA_USERNAME != '' && vars.PUBLISH_GITEA_REGISTRY != '' && vars.PUBLISH_GITEA_IMAGE != '' && vars.PUBLISH_GITEA_REGISTRY || '' }}
      DOCKERHUB_IMAGE: ${{ secrets.PUBLISH_DOCKERHUB_TOKEN != '' && vars.PUBLISH_DOCKERHUB_USERNAME != '' && vars.PUBLISH_DOCKERHUB_IMAGE != '' && vars.PUBLISH_DOCKERHUB_IMAGE || '' }}
    steps:
      # Classify each destination from the job-env flags: enabled (one log line), partial
      # (one ::warning::), or unconfigured (silent) (AD-9). It holds no gating rule: the HAS_*
      # presence booleans only name what is missing, and no secret value reaches this step.
      # A list name with no matching flag or HAS_* key is an edit error and fails the step.
      - name: Destination configuration
        env:
          JOB: publish-image
          ENVIRONMENT: release
          # <Destination>|<PUBLISH flag>|<ANY flag>|<required inputs>|<own inputs>|<hint>
          DESTINATIONS: |
            GHCR|PUBLISH_GHCR|ANY_GHCR|vars.PUBLISH_GHCR_IMAGE secrets.PUBLISH_GHCR_TOKEN|secrets.PUBLISH_GHCR_TOKEN vars.PUBLISH_GHCR_USERNAME vars.PUBLISH_GHCR_IMAGE|On GitHub the job's own token pushes to ghcr.io, so secrets.PUBLISH_GHCR_TOKEN is needed only on act or Gitea.
            Gitea container registry|PUBLISH_GITEA|ANY_GITEA|secrets.PUBLISH_GITEA_TOKEN vars.PUBLISH_GITEA_USERNAME vars.PUBLISH_GITEA_REGISTRY vars.PUBLISH_GITEA_IMAGE|vars.PUBLISH_GITEA_REGISTRY vars.PUBLISH_GITEA_IMAGE|
            Docker Hub|PUBLISH_DOCKERHUB|ANY_DOCKERHUB|secrets.PUBLISH_DOCKERHUB_TOKEN vars.PUBLISH_DOCKERHUB_USERNAME vars.PUBLISH_DOCKERHUB_IMAGE|secrets.PUBLISH_DOCKERHUB_TOKEN vars.PUBLISH_DOCKERHUB_USERNAME vars.PUBLISH_DOCKERHUB_IMAGE|
          # <legacy name>|<replacement, or empty when there is none>
          LEGACY: ""
          HAS_PUBLISH_GHCR_TOKEN: ${{ secrets.PUBLISH_GHCR_TOKEN != '' }}
          HAS_PUBLISH_GHCR_USERNAME: ${{ vars.PUBLISH_GHCR_USERNAME != '' }}
          HAS_PUBLISH_GHCR_IMAGE: ${{ vars.PUBLISH_GHCR_IMAGE != '' }}
          HAS_PUBLISH_GITEA_TOKEN: ${{ secrets.PUBLISH_GITEA_TOKEN != '' }}
          HAS_PUBLISH_GITEA_USERNAME: ${{ vars.PUBLISH_GITEA_USERNAME != '' }}
          HAS_PUBLISH_GITEA_REGISTRY: ${{ vars.PUBLISH_GITEA_REGISTRY != '' }}
          HAS_PUBLISH_GITEA_IMAGE: ${{ vars.PUBLISH_GITEA_IMAGE != '' }}
          HAS_PUBLISH_DOCKERHUB_TOKEN: ${{ secrets.PUBLISH_DOCKERHUB_TOKEN != '' }}
          HAS_PUBLISH_DOCKERHUB_USERNAME: ${{ vars.PUBLISH_DOCKERHUB_USERNAME != '' }}
          HAS_PUBLISH_DOCKERHUB_IMAGE: ${{ vars.PUBLISH_DOCKERHUB_IMAGE != '' }}
        run: |
          defined() { [ -n "${!1+x}" ] || { echo "::error title=$JOB::Destination configuration: $1 is not defined (list edit error)"; exit 1; }; }
          has() { local v="HAS_${1#*.}"; defined "$v"; [ "${!v}" = true ]; }
          join() { local IFS=,; local s="$*"; echo "${s//,/, }"; }
          where="Set them as $ENVIRONMENT environment secrets/variables (GitHub) or repository Actions secrets/variables (Gitea)"
          while IFS='|' read -r dest publish any inputs own hint; do
            [ -n "$dest" ] || continue
            for flag in $publish $any; do defined "$flag"; done
            if [ -n "$publish" ] && [ "${!publish}" = true ]; then
              echo "$dest enabled"
            elif [ -n "$any" ] && [ "${!any}" = true ]; then
              missing=(); set_own=()
              for input in $inputs; do has "$input" || missing+=("$input"); done
              for input in $own; do if has "$input"; then set_own+=("$input"); fi; done
              echo "::warning title=$JOB::$dest partially configured, skipped: missing $(join "${missing[@]}"). $where, or unset $(join "${set_own[@]}") to disable it.${hint:+ $hint}"
            fi
          done <<< "$DESTINATIONS"
          found=()
          while IFS='|' read -r old new; do
            [ -n "$old" ] || continue
            if has "$old"; then found+=("$old (${new:+now }${new:-no replacement})"); fi
          done <<< "$LEGACY"
          if (( ${#found[@]} )); then
            echo "::warning title=$JOB::Legacy settings found, no longer read: $(join "${found[@]}"). Move each value to its replacement (docs/ci/pipeline-walkthrough.md, \"Where things are published\"), then delete the legacy name."
          fi

      # The built version must be the pushed tag's (AD-12).
      - name: Version guard
        env:
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          [ "$VERSION" = "${TAG#v}" ] || { echo "refusing to publish $VERSION from tag $TAG" >&2; exit 1; }

      # Build context for docker/Dockerfile; ref-free (AD-6). Unconditional, like the download
      # and the hash check after it: they touch no credential, and a run with no registry
      # enabled still refuses a tampered dist (AD-17).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: dist
          path: dist/

      # The dist is byte-identical to what build hashed (AD-17, BL-E013-021); before the CA
      # import and every login or upload, so a tampered artifact meets no credential (AD-18).
      - name: Verify dist hashes
        id: verify
        env:
          WHEEL_SHA256: ${{ needs.build.outputs.wheel-sha256 }}
          SDIST_SHA256: ${{ needs.build.outputs.sdist-sha256 }}
        run: |
          shopt -s nullglob dotglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          entries=(dist/*)
          # Uploads send dist/*, so nothing beside the two hashed files may be there.
          if (( ${#wheels[@]} != 1 || ${#sdists[@]} != 1 || ${#entries[@]} != 2 )); then
            echo >&2 "verify: dist/ must hold exactly one wheel and one sdist and nothing else, found ${#entries[@]} entries:"
            ls -la dist >&2
            exit 1
          fi
          bad=0
          for output in wheel-sha256 sdist-sha256; do
            var="${output%%-*}"; var="${var^^}_SHA256"
            if ! [[ "${!var}" =~ ^[0-9a-f]{64}$ ]]; then
              echo >&2 "verify: needs.build.outputs.${output} is not a 64-hex SHA-256: '${!var}'"
              bad=1
            fi
          done
          (( bad == 0 )) || exit 1
          echo "${wheels[0]}: expected $WHEEL_SHA256 computed $(sha256sum "${wheels[0]}" | cut -d' ' -f1)"
          echo "${sdists[0]}: expected $SDIST_SHA256 computed $(sha256sum "${sdists[0]}" | cut -d' ' -f1)"
          printf '%s  %s\n' "$WHEEL_SHA256" "${wheels[0]}" "$SDIST_SHA256" "${sdists[0]}" | sha256sum -c -
          echo "wheel-path=${wheels[0]}" >> "$GITHUB_OUTPUT"

      # Private CA for runner and BuildKit (AD-18).
      - uses: LiquidLogicLabs/git-action-ca-certificate-import@v3
        id: ca
        if: env.PUBLISH_CA == 'true'
        with:
          certificate: ${{ secrets.PUBLISH_CA_CERTIFICATE }}
          # BuildKit trusts the CA only for the hosts named here (one [registry."<host>"]
          # table each); the enabled Gitea registry is the one operator-set host (AD-18).
          # GHCR and Docker Hub are public. No Gitea registry: no file, no --config.
          generate-buildkit: ${{ env.GITEA_REGISTRY != '' }}
          buildkit-registries: ${{ env.GITEA_REGISTRY }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUBLISH_GHCR == 'true'
        with:
          registry: ghcr.io
          username: ${{ vars.PUBLISH_GHCR_USERNAME || github.actor }}
          password: ${{ secrets.PUBLISH_GHCR_TOKEN || github.token }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUBLISH_GITEA == 'true'
        with:
          registry: ${{ vars.PUBLISH_GITEA_REGISTRY }}
          username: ${{ vars.PUBLISH_GITEA_USERNAME }}
          password: ${{ secrets.PUBLISH_GITEA_TOKEN }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUBLISH_DOCKERHUB == 'true'
        with:
          username: ${{ vars.PUBLISH_DOCKERHUB_USERNAME }}
          password: ${{ secrets.PUBLISH_DOCKERHUB_TOKEN }}

      # Release tag set (AD-8), all from image-version; blank image lines are dropped.
      # F-11: the bare major tag is written only from 1.0.0 on, so a 0.x release moves no
      # `:0` tag (X.Y.Z, X.Y and latest only).
      # BL-E014-075: the action sets org.opencontainers.image.version from the highest-
      # priority tag, and type=semver (900) outranks type=raw (200), so without an explicit
      # priority the label read `0.3` for 0.3.0. priority=1000 pins it to the full version;
      # the workflows-version-label-priority pre-commit hook enforces it (AD-8).
      - uses: LiquidLogicLabs/git-action-docker-metadata@v6
        id: meta
        if: env.PUBLISH_IMAGE == 'true'
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.GITEA_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.build.outputs.image-version }},priority=1000
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.build.outputs.image-version }}
            type=semver,pattern={{major}},value=${{ needs.build.outputs.image-version }},enable=${{ !startsWith(needs.build.outputs.image-version, '0.') }}
            type=raw,value=latest,enable=${{ needs.validate-tag.outputs.is-latest == 'true' }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: env.PUBLISH_IMAGE == 'true'

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: env.PUBLISH_IMAGE == 'true'
        with:
          buildkitd-config: ${{ steps.ca.outputs.buildkit-path }}

      # One multi-arch build pushed to every enabled registry (AD-10, AD-17).
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        if: env.PUBLISH_IMAGE == 'true'
        # Build records are uploaded as an artifact by default, using a protocol act
        # 0.2.89 rejects (mime_type, nektos/act #6022); nothing consumes them here.
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            POETRY_VERSION=2.5.1
            WHEEL_PATH=${{ steps.verify.outputs.wheel-path }}
            WHEEL_SHA256=${{ needs.build.outputs.wheel-sha256 }}
            VERSION=${{ needs.build.outputs.image-version }}
            REVISION=${{ github.sha }}

      # Test the pushed image by digest, from the first enabled registry (AD-10).
      - uses: LiquidLogicLabs/git-action-docker-test@v2
        if: env.PUBLISH_IMAGE == 'true'
        env:
          TEST_IMAGE: ${{ env.GHCR_IMAGE || env.GITEA_IMAGE || env.DOCKERHUB_IMAGE }}
        with:
          image: ${{ env.TEST_IMAGE }}@${{ steps.push.outputs.digest }}

  release:
    name: release
    # Publish credentials live only in the release environment (ADR-0039).
    environment: release
    needs: [build, publish-package, publish-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the job's own token creates the forge release (ADR-0052)
    # A job-level if cannot read env, so every step is gated instead (AD-12, Conventions).
    # The forge release uses PUBLISH_RELEASE_TOKEN when set, else the job's own token; under
    # `just act` both are empty and the release is skipped.
    env:
      PUBLISH_CA: ${{ secrets.PUBLISH_CA_CERTIFICATE != '' }}
      PUBLISH_RELEASE: ${{ secrets.PUBLISH_RELEASE_TOKEN != '' || github.token != '' }}
    steps:
      # Classify each destination from the job-env flags: enabled (one log line), partial
      # (one ::warning::), or unconfigured (silent) (AD-9). It holds no gating rule: the HAS_*
      # presence booleans only name what is missing, and no secret value reaches this step.
      # A list name with no matching flag or HAS_* key is an edit error and fails the step.
      - name: Destination configuration
        env:
          JOB: release
          ENVIRONMENT: release
          # <Destination>|<PUBLISH flag>|<ANY flag>|<required inputs>|<own inputs>|<hint>
          DESTINATIONS: |
            Forge release|PUBLISH_RELEASE||secrets.PUBLISH_RELEASE_TOKEN|secrets.PUBLISH_RELEASE_TOKEN|
          # <legacy name>|<replacement, or empty when there is none>
          LEGACY: ""
          HAS_PUBLISH_RELEASE_TOKEN: ${{ secrets.PUBLISH_RELEASE_TOKEN != '' }}
        run: |
          defined() { [ -n "${!1+x}" ] || { echo "::error title=$JOB::Destination configuration: $1 is not defined (list edit error)"; exit 1; }; }
          has() { local v="HAS_${1#*.}"; defined "$v"; [ "${!v}" = true ]; }
          join() { local IFS=,; local s="$*"; echo "${s//,/, }"; }
          where="Set them as $ENVIRONMENT environment secrets/variables (GitHub) or repository Actions secrets/variables (Gitea)"
          while IFS='|' read -r dest publish any inputs own hint; do
            [ -n "$dest" ] || continue
            for flag in $publish $any; do defined "$flag"; done
            if [ -n "$publish" ] && [ "${!publish}" = true ]; then
              echo "$dest enabled"
            elif [ -n "$any" ] && [ "${!any}" = true ]; then
              missing=(); set_own=()
              for input in $inputs; do has "$input" || missing+=("$input"); done
              for input in $own; do if has "$input"; then set_own+=("$input"); fi; done
              echo "::warning title=$JOB::$dest partially configured, skipped: missing $(join "${missing[@]}"). $where, or unset $(join "${set_own[@]}") to disable it.${hint:+ $hint}"
            fi
          done <<< "$DESTINATIONS"
          found=()
          while IFS='|' read -r old new; do
            [ -n "$old" ] || continue
            if has "$old"; then found+=("$old (${new:+now }${new:-no replacement})"); fi
          done <<< "$LEGACY"
          if (( ${#found[@]} )); then
            echo "::warning title=$JOB::Legacy settings found, no longer read: $(join "${found[@]}"). Move each value to its replacement (docs/ci/pipeline-walkthrough.md, \"Where things are published\"), then delete the legacy name."
          fi

      # Full history for the previous tag; ref-free (AD-6). Unconditional, like the download
      # and the hash check after it: they touch no credential, and a run with no release
      # token still refuses a tampered dist (AD-17).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: dist
          path: dist/

      # The dist is byte-identical to what build hashed (AD-17, BL-E013-021); before the CA
      # import and every login or upload, so a tampered artifact meets no credential (AD-18).
      - name: Verify dist hashes
        id: verify
        env:
          WHEEL_SHA256: ${{ needs.build.outputs.wheel-sha256 }}
          SDIST_SHA256: ${{ needs.build.outputs.sdist-sha256 }}
        run: |
          shopt -s nullglob dotglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          entries=(dist/*)
          # Uploads send dist/*, so nothing beside the two hashed files may be there.
          if (( ${#wheels[@]} != 1 || ${#sdists[@]} != 1 || ${#entries[@]} != 2 )); then
            echo >&2 "verify: dist/ must hold exactly one wheel and one sdist and nothing else, found ${#entries[@]} entries:"
            ls -la dist >&2
            exit 1
          fi
          bad=0
          for output in wheel-sha256 sdist-sha256; do
            var="${output%%-*}"; var="${var^^}_SHA256"
            if ! [[ "${!var}" =~ ^[0-9a-f]{64}$ ]]; then
              echo >&2 "verify: needs.build.outputs.${output} is not a 64-hex SHA-256: '${!var}'"
              bad=1
            fi
          done
          (( bad == 0 )) || exit 1
          echo "${wheels[0]}: expected $WHEEL_SHA256 computed $(sha256sum "${wheels[0]}" | cut -d' ' -f1)"
          echo "${sdists[0]}: expected $SDIST_SHA256 computed $(sha256sum "${sdists[0]}" | cut -d' ' -f1)"
          printf '%s  %s\n' "$WHEEL_SHA256" "${wheels[0]}" "$SDIST_SHA256" "${sdists[0]}" | sha256sum -c -
          echo "wheel-path=${wheels[0]}" >> "$GITHUB_OUTPUT"

      # Private CA for the forge API (AD-18). The one step here gated on PUBLISH_CA, not
      # PUBLISH_RELEASE: a step tests exactly one flag (AD-9, AD-18); it publishes nothing.
      - uses: LiquidLogicLabs/git-action-ca-certificate-import@v3
        id: ca
        if: env.PUBLISH_CA == 'true'
        with:
          certificate: ${{ secrets.PUBLISH_CA_CERTIFICATE }}

      # Previous plain vX.Y.Z tag; the changelog builder has no tag-pattern input.
      # Empty on the first release. awk reads all input and exits 0 on no match.
      - name: Previous release tag
        id: prev
        if: env.PUBLISH_RELEASE == 'true'
        run: |
          prev="$(git tag --merged HEAD^ --sort=-v:refname | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ && !f {print; f=1}')"
          echo "previous release tag: ${prev:-<none>}"
          echo "tag=$prev" >> "$GITHUB_OUTPUT"

      # Empty from-tag falls back to the action's auto-detection (first release only).
      # COMMIT mode: most changes land on main without a pull request, which PR mode skips.
      - uses: LiquidLogicLabs/git-action-release-changelog-builder@v3
        id: notes
        if: env.PUBLISH_RELEASE == 'true'
        with:
          token: ${{ secrets.PUBLISH_RELEASE_TOKEN || github.token }}
          from-tag: ${{ steps.prev.outputs.tag }}
          mode: COMMIT
          configuration: .github/release-notes.json

      - uses: LiquidLogicLabs/git-action-release@v2
        if: env.PUBLISH_RELEASE == 'true'
        with:
          token: ${{ secrets.PUBLISH_RELEASE_TOKEN || github.token }}
          tag: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.changelog }}
          artifacts: dist/*.whl,dist/*.tar.gz
          allow-updates: true
