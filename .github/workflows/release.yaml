name: release

# A vX.Y.Z tag publishes a release (AD-1, AD-12). Every destination is enabled only by its
# PUBLISH_*_TOKEN secret (AD-9); with none set, the run succeeds and publishes nothing.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Releases queue; one is never cancelled mid-flight (AD-14).
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate-tag:
    name: validate-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Only a plain vX.Y.Z tag releases (AD-12); floating and pre-release tags do not.
      - uses: LiquidLogicLabs/git-action-tag-validate-version@v2
        id: tag
        with:
          tag: ${{ github.ref_name }}
          version-type: regex
          version-regex: '^v\d+\.\d+\.\d+$'

      - name: Reject tag
        if: steps.tag.outputs.is-valid != 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "refusing to release tag $TAG: it must match ^v<major>.<minor>.<patch>$" >&2
          exit 1

      # Full history, ref-free (AD-6): provides refs/remotes/origin/<default branch>.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The tagged commit must be on the default branch (AD-12, ADR-0038). This guards
      # against mistakes only: it runs from the tagged commit, so whoever can push a v* tag
      # can also remove it. The control is forge tag protection on v*.
      - name: Tag is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$DEFAULT_BRANCH" ]; then
            echo "refusing to release tag $TAG: the event payload names no default branch" >&2
            exit 1
          fi
          sha="$(git rev-parse HEAD)"
          echo "tag=$TAG commit=$sha default-branch=$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor HEAD "refs/remotes/origin/$DEFAULT_BRANCH"; then
            echo "refusing to release tag $TAG: commit $sha is not on origin/$DEFAULT_BRANCH" >&2
            exit 1
          fi

  build:
    needs: validate-tag
    uses: ./.github/workflows/build.yaml # zizmor: ignore[self-repository] AD-6: GitHub-only $/ syntax; Gitea and act resolve ./ only

  publish-package:
    name: publish-package
    # Publish credentials live only in the release environment (ADR-0039).
    environment: release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Destination flags (AD-9).
    env:
      PUBLISH_CA: ${{ secrets.PUBLISH_CA_CERTIFICATE != '' }}
      PUBLISH_GITEA: ${{ secrets.PUBLISH_GITEA_TOKEN != '' }}
      PUBLISH_PYPI: ${{ secrets.PUBLISH_PYPI_TOKEN != '' }}
    steps:
      # The built version must be the pushed tag's (AD-12).
      - name: Version guard
        env:
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          [ "$VERSION" = "${TAG#v}" ] || { echo "refusing to publish $VERSION from tag $TAG" >&2; exit 1; }

      # Private CA for runner and twine (AD-18).
      - uses: LiquidLogicLabs/git-action-ca-certificate-import@v3
        id: ca
        if: env.PUBLISH_CA == 'true'
        with:
          certificate: ${{ secrets.PUBLISH_CA_CERTIFICATE }}
          generate-buildkit: true

      # Ref-free (AD-6); before download, which checkout would otherwise clean.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: dist
          path: dist/

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # Locked twine from the dev group (AD-11). Strict versioning resolves from this job's
      # full-history, tagged checkout (AD-7); the uploaded version is the dist wheel's (AD-2).
      - name: Install twine
        run: |
          python -m pip install "poetry==2.4.2"
          poetry install --only dev --no-root

      - name: Upload to Gitea
        if: env.PUBLISH_GITEA == 'true'
        env:
          REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
          REPOSITORY_URL: ${{ vars.PUBLISH_GITEA_PYPI_URL }}
          TWINE_USERNAME: ${{ vars.PUBLISH_GITEA_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PUBLISH_GITEA_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        # twine refuses --skip-existing for any index but PyPI/TestPyPI
        # (UnsupportedConfiguration), so a re-run is kept safe here by asking Gitea which of
        # this version's files it already holds and uploading only the missing ones (AD-11).
        run: |
          base="${REPOSITORY_URL%/api/packages/*}"
          rest="${REPOSITORY_URL#*/api/packages/}"
          owner="${rest%%/*}"
          wheel="$(basename dist/*.whl)"
          name="${wheel%%-*}"
          name="${name//_/-}"
          files_url="$base/api/v1/packages/$owner/pypi/$name/$VERSION/files"
          code="$(curl -sS -o existing.json -w '%{http_code}' -H "Authorization: token $TWINE_PASSWORD" "$files_url")"
          case "$code" in
            200) ;;
            404) echo '[]' > existing.json ;;
            *) echo "Upload to Gitea: unexpected HTTP $code from $files_url" >&2; exit 1 ;;
          esac
          pending=()
          for file in dist/*; do
            if ! jq -e --arg n "$(basename "$file")" 'any(.[]; .name == $n)' existing.json > /dev/null; then
              pending+=("$file")
            fi
          done
          if [ "${#pending[@]}" -eq 0 ]; then
            echo "Gitea already holds every file of $name $VERSION; nothing to upload"
            exit 0
          fi
          poetry run twine upload --non-interactive --repository-url "$REPOSITORY_URL" "${pending[@]}"

      - name: Upload to PyPI
        if: env.PUBLISH_PYPI == 'true'
        env:
          REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
          REPOSITORY_URL: https://upload.pypi.org/legacy/
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PUBLISH_PYPI_TOKEN }}
        run: poetry run twine upload --non-interactive --skip-existing --repository-url "$REPOSITORY_URL" dist/*

  publish-image:
    name: publish-image
    # Publish credentials live only in the release environment (ADR-0039).
    environment: release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Destination flags (AD-9) and the one combined flag plus enabled image names (AD-10).
    env:
      PUBLISH_CA: ${{ secrets.PUBLISH_CA_CERTIFICATE != '' }}
      PUBLISH_GHCR: ${{ secrets.PUBLISH_GHCR_TOKEN != '' }}
      PUBLISH_GITEA: ${{ secrets.PUBLISH_GITEA_TOKEN != '' }}
      PUBLISH_DOCKERHUB: ${{ secrets.PUBLISH_DOCKERHUB_TOKEN != '' }}
      PUBLISH_IMAGE: ${{ secrets.PUBLISH_GHCR_TOKEN != '' || secrets.PUBLISH_GITEA_TOKEN != '' || secrets.PUBLISH_DOCKERHUB_TOKEN != '' }}
      GHCR_IMAGE: ${{ secrets.PUBLISH_GHCR_TOKEN != '' && vars.PUBLISH_GHCR_IMAGE || '' }}
      GITEA_IMAGE: ${{ secrets.PUBLISH_GITEA_TOKEN != '' && vars.PUBLISH_GITEA_IMAGE || '' }}
      DOCKERHUB_IMAGE: ${{ secrets.PUBLISH_DOCKERHUB_TOKEN != '' && vars.PUBLISH_DOCKERHUB_IMAGE || '' }}
    steps:
      # The built version must be the pushed tag's (AD-12).
      - name: Version guard
        env:
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          [ "$VERSION" = "${TAG#v}" ] || { echo "refusing to publish $VERSION from tag $TAG" >&2; exit 1; }

      # Private CA for runner and BuildKit (AD-18).
      - uses: LiquidLogicLabs/git-action-ca-certificate-import@v3
        id: ca
        if: env.PUBLISH_CA == 'true'
        with:
          certificate: ${{ secrets.PUBLISH_CA_CERTIFICATE }}
          generate-buildkit: true

      # An enabled registry needs its image and registry variables, before any login (AD-10).
      - name: Registry configuration guard
        if: env.PUBLISH_IMAGE == 'true'
        env:
          GITEA_REGISTRY: ${{ vars.PUBLISH_GITEA_REGISTRY }}
        run: |
          missing=0
          for registry in GHCR GITEA DOCKERHUB; do
            flag="PUBLISH_${registry}"
            image="${registry}_IMAGE"
            if [ "${!flag}" = "true" ] && [ -z "${!image}" ]; then
              echo "publish-image: ${registry} is enabled by PUBLISH_${registry}_TOKEN but vars.PUBLISH_${registry}_IMAGE is empty" >&2
              missing=1
            fi
          done
          if [ "$PUBLISH_GITEA" = "true" ] && [ -z "$GITEA_REGISTRY" ]; then
            echo "publish-image: GITEA is enabled by PUBLISH_GITEA_TOKEN but vars.PUBLISH_GITEA_REGISTRY is empty" >&2
            missing=1
          fi
          exit "$missing"

      # Build context for docker/Dockerfile; ref-free (AD-6).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.PUBLISH_IMAGE == 'true'
        with:
          persist-credentials: false

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        if: env.PUBLISH_IMAGE == 'true'
        with:
          name: dist
          path: dist/

      - name: Locate wheel
        id: wheel
        if: env.PUBLISH_IMAGE == 'true'
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if (( ${#wheels[@]} != 1 )); then
            echo >&2 "publish-image: dist/ must hold exactly one wheel, found ${#wheels[@]}"
            exit 1
          fi
          sha256="$(sha256sum "${wheels[0]}" | cut -d' ' -f1)"
          echo "wheel=${wheels[0]} sha256=$sha256"
          {
            echo "path=${wheels[0]}"
            echo "sha256=$sha256"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUBLISH_GHCR == 'true'
        with:
          registry: ghcr.io
          username: ${{ vars.PUBLISH_GHCR_USERNAME }}
          password: ${{ secrets.PUBLISH_GHCR_TOKEN }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUBLISH_GITEA == 'true'
        with:
          registry: ${{ vars.PUBLISH_GITEA_REGISTRY }}
          username: ${{ vars.PUBLISH_GITEA_USERNAME }}
          password: ${{ secrets.PUBLISH_GITEA_TOKEN }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUBLISH_DOCKERHUB == 'true'
        with:
          username: ${{ vars.PUBLISH_DOCKERHUB_USERNAME }}
          password: ${{ secrets.PUBLISH_DOCKERHUB_TOKEN }}

      # Release tag set (AD-8), all from image-version; blank image lines are dropped.
      - uses: LiquidLogicLabs/git-action-docker-metadata@v6
        id: meta
        if: env.PUBLISH_IMAGE == 'true'
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.GITEA_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.build.outputs.image-version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.build.outputs.image-version }}
            type=semver,pattern={{major}},value=${{ needs.build.outputs.image-version }}
            type=raw,value=latest

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: env.PUBLISH_IMAGE == 'true'

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: env.PUBLISH_IMAGE == 'true'
        with:
          config: ${{ steps.ca.outputs.buildkit-path }}

      # One multi-arch build pushed to every enabled registry (AD-10, AD-17).
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        if: env.PUBLISH_IMAGE == 'true'
        # Build records are uploaded as an artifact by default, using a protocol act
        # 0.2.89 rejects (mime_type, nektos/act #6022); nothing consumes them here.
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            POETRY_VERSION=2.4.2
            WHEEL_PATH=${{ steps.wheel.outputs.path }}
            WHEEL_SHA256=${{ steps.wheel.outputs.sha256 }}
            VERSION=${{ needs.build.outputs.image-version }}
            REVISION=${{ github.sha }}

      # Test the pushed image by digest, from the first enabled registry (AD-10).
      - uses: LiquidLogicLabs/git-action-docker-test@v2
        if: env.PUBLISH_IMAGE == 'true'
        env:
          TEST_IMAGE: ${{ env.GHCR_IMAGE || env.GITEA_IMAGE || env.DOCKERHUB_IMAGE }}
        with:
          image: ${{ env.TEST_IMAGE }}@${{ steps.push.outputs.digest }}

  release:
    name: release
    # Publish credentials live only in the release environment (ADR-0039).
    environment: release
    needs: [build, publish-package, publish-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A job-level if cannot read env, so every step is gated instead (AD-12, Conventions).
    env:
      PUBLISH_CA: ${{ secrets.PUBLISH_CA_CERTIFICATE != '' }}
      PUBLISH_RELEASE: ${{ secrets.PUBLISH_RELEASE_TOKEN != '' }}
    steps:
      # Private CA for the forge API (AD-18). The one step here gated on PUBLISH_CA, not
      # PUBLISH_RELEASE: a step tests exactly one flag (AD-9, AD-18); it publishes nothing.
      - uses: LiquidLogicLabs/git-action-ca-certificate-import@v3
        id: ca
        if: env.PUBLISH_CA == 'true'
        with:
          certificate: ${{ secrets.PUBLISH_CA_CERTIFICATE }}
          generate-buildkit: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.PUBLISH_RELEASE == 'true'
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        if: env.PUBLISH_RELEASE == 'true'
        with:
          name: dist
          path: dist/

      # Previous plain vX.Y.Z tag; the changelog builder has no tag-pattern input.
      # Empty on the first release. awk reads all input and exits 0 on no match.
      - name: Previous release tag
        id: prev
        if: env.PUBLISH_RELEASE == 'true'
        run: |
          prev="$(git tag --merged HEAD^ --sort=-v:refname | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ && !f {print; f=1}')"
          echo "previous release tag: ${prev:-<none>}"
          echo "tag=$prev" >> "$GITHUB_OUTPUT"

      # Empty from-tag falls back to the action's auto-detection (first release only).
      - uses: LiquidLogicLabs/git-action-release-changelog-builder@v3
        id: notes
        if: env.PUBLISH_RELEASE == 'true'
        with:
          token: ${{ secrets.PUBLISH_RELEASE_TOKEN }}
          from-tag: ${{ steps.prev.outputs.tag }}

      - uses: LiquidLogicLabs/git-action-release@v2
        if: env.PUBLISH_RELEASE == 'true'
        with:
          token: ${{ secrets.PUBLISH_RELEASE_TOKEN }}
          tag: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.changelog }}
          artifacts: dist/*.whl,dist/*.tar.gz
          allow-updates: true
