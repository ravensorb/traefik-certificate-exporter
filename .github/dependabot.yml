version: 2
updates:
  # zizmor enforces the pin form (AD-5); Dependabot keeps the pins current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # Semver-major updates of both artifact actions are ignored: act 0.2.89's artifact
    # server rejects upload-artifact >= v6 / download-artifact >= v7 (sig padding,
    # nektos/act #6114; mime_type from upload v7, #6022). Revisit when an act release
    # ships PR #6174.
    ignore:
      - dependency-name: "actions/upload-artifact"
        update-types: ["version-update:semver-major"]
      - dependency-name: "actions/download-artifact"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # SHA-frozen pre-commit hook revs (BL-E013-020, AD-5). Dependabot resolves the latest tag
  # and rewrites both the SHA and its `# frozen:` comment. GitHub only; Gitea updates them
  # by hand (docs/developer.md).
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # Hash-locked Poetry bootstrap (BL-E013-024, ADR-0042). If a PR here drops the --hash
  # lines or fails `pip install --require-hashes`, remove this entry and regenerate the file
  # by hand (docs/developer.md).
  - package-ecosystem: "pip"
    directory: "/.github/requirements"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
