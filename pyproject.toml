[tool.poetry]
name = "traefik-certificate-exporter"
version = "0.0.0"
description = "Watches for changes to traefik acme json files and extracts certificates to a specific folder"
authors = ["Shawn Anderson <sanderson@eye-catcher.com>"]
readme = "README.md"
repository = "https://github.com/ravensorb/traefik-certificate-exporter"
homepage = "https://github.com/ravensorb/traefik-certificate-exporter"
keywords = ['traefik', 'letsencrypt']
packages = [
    {include = "traefik_certificate_exporter", from = "src"},
]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
watchdog = "^6.0"
docker = "^7.2"
confuse = "^2.0.1"
python-dotenv = "^1.2.2"
importlib-resources = "^6.4.0"
jsonpickle = "^3.0.3"
coloredlogs = "^15.0.1"
logging-tree = "^1.9"
cryptography = "^50.0.2"
python-json-logger = "^4.2.0"
apprise = "^1.9.0"
python-dateutil = "^2.9.0"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
pre-commit = "^3.2.1"
pytest = "^9.1.1"
poetry = "^2.4.2"
# Provides the `pysemver` CLI that `just release` uses to compute the next version (AD-15).
semver = "==3.1.0"
# Dependency gates, the mypy type gate and the import-linter layering gate run as
# `repo: local`, `language: system` pre-commit hooks; their versions are pinned here by
# poetry.lock, not by a frozen hook `rev` or `additional_dependencies` (C-10, ADR-0042 as
# amended by E015-S02-003): hashed, audited by pip-audit and updated by Dependabot `pip`.
mypy = "^2.3.1"
types-pyyaml = "^6.0.12.20260906"
types-python-dateutil = "^2.9.0.20260807"
import-linter = "^2.15"
pip-audit = "^2.10.1"
deptry = "^0.25.1"
# The spawn-site guard's suppression test asks ruff itself which TID251 reports are
# suppressed (ADR-0050, F10 of review E015-S01-001). Held at the pre-commit hook's frozen
# ruff version; tests/libs/test_post_export.py fails if the two differ.
ruff = "==0.16.5"

# Everything a credentialed publish job installs (AD-11): `poetry install --only publish
# --no-root`, so no dev toolchain sits beside a publish token. `twine` is declared here only.
# Optional, yet still in every dev venv and the pip-audit scope, because `just install` and
# build.yaml run `poetry sync --all-groups` (ADR-0042).
[tool.poetry.group.publish]
optional = true

[tool.poetry.group.publish.dependencies]
twine = "^7.0.0"

[tool.poetry.scripts]
traefik-certificate-exporter = "traefik_certificate_exporter.app:main"

[tool.mypy]
python_version = "3.11"
# The pre-commit hook runs `poetry run mypy` in the Poetry venv (E015-S02-003), so the
# runtime dependencies and the two stub packages are importable and typed. This stays on
# because some locked dependencies ship neither `py.typed` nor stubs (docker-py, see the
# override below; jsonpickle, coloredlogs, logging-tree): import
# resolution of untyped third-party code is not the thing this gate checks.
ignore_missing_imports = true
# Whether an ignore is "unused" depends on which dependencies are importable, which
# differs with the interpreter and platform markers a developer's venv was built with
# (`python_version` above is fixed, the venv's interpreter is not). Enabling it makes the
# gate environment-dependent.
warn_unused_ignores = false

[[tool.mypy.overrides]]
# The application package predates any type gate and is largely unannotated. It is
# checked in default mode -- a NEW type error there still fails this gate -- without
# requiring annotations. Annotating it is real work with real regression risk and belongs
# in its own change. Removing this block is how that work would start.
module = ["traefik_certificate_exporter.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
# docker-py ships no py.typed; mypy's partial view of it misses its re-exports.
module = ["docker.*"]
follow_imports = "skip"

# Declared-vs-imported check over src/ (review m8, NFR-3), run by the `deptry` pre-commit
# hook. No rule is ignored globally: an exception goes in [tool.deptry.per_rule_ignores],
# naming the one package, with a comment giving the reason and a BL- key.
[tool.deptry]
known_first_party = ["traefik_certificate_exporter"]

# Spine AD-13 (module layering), checked by the `import-linter` pre-commit hook (SD-01-1).
# The contracts derive their scope from the package tree, not a hand-kept list:
# `acyclic_siblings` covers every package under the root, and the `libs` layers contract is
# `exhaustive`, so a new module under libs/ fails until it is placed in a layer.
# Covered: in-package import cycles, upward imports between the listed layers, any libs/
# module importing `app`. Not covered: imports done through `importlib` or strings.
[tool.importlinter]
root_package = "traefik_certificate_exporter"

[[tool.importlinter.contracts]]
id = "no-cycles"
name = "No import cycles between sibling modules (AD-13)"
type = "acyclic_siblings"
ancestors = ["traefik_certificate_exporter"]

[[tool.importlinter.contracts]]
id = "entrypoint-on-top"
name = "app is the entrypoint; nothing under libs imports it (AD-13)"
type = "layers"
layers = ["traefik_certificate_exporter.app", "traefik_certificate_exporter.libs"]

[[tool.importlinter.contracts]]
id = "libs-layers"
name = "libs layering as built: leaves import nothing in-package (AD-13)"
type = "layers"
containers = ["traefik_certificate_exporter.libs"]
exhaustive = true
layers = [
    "certificate_exporter",
    "cli_args",
    "docker",
    "settings",
    "legacy_settings",
    "notify | post_export",
    "logging_utils | object | suggest",
]

# Spawn-site guard (ADR-0050, E015-S01-001 AC 5): the post-export hook is the only process the
# package starts, so ADR-0049's root-mode trust rule on `postexportcommand` is the one gate on
# what root executes. ruff's default rule set is kept; TID251 and PGH004 are added to it.
#
# Coverage limit -- what this does NOT catch (global rule 3):
# - dynamic access: `getattr(os, "system")`, `importlib.import_module`, `__import__`,
#   `eval`/`exec` of source text. No static check resolves these; review is the only check.
# - attribute calls on runtime objects: `loop.subprocess_exec` / `loop.subprocess_shell` on an
#   event loop, `ctypes.CDLL(...).system` once a CDLL object exists. ruff resolves imports,
#   not the type of a value; the banned modules (`ctypes`, `asyncio.subprocess`) catch the
#   import, not a loop method. Review is the only check.
# - `noqa`: `libs/post_export.py` carries `# noqa: TID251` on its `import subprocess` line.
#   ruff reports a banned module only at its import, so that one `noqa` admits EVERY
#   `subprocess` call in post_export.py; a second call there is held by review. Other banned
#   names in that file are still reported. tests/libs/test_post_export.py runs the dev group's
#   ruff with `--select TID251 --ignore-noqa` over the package directory and fails on any
#   report but that import line: `--ignore-noqa` disregards every suppression comment ruff
#   honours (line `noqa`, file-level `ruff: noqa` / `flake8: noqa`, range `ruff: disable[...]`).
#   PGH004 (selected below) reports a blanket `# noqa` / `# ruff: noqa` / `# flake8: noqa`
#   with no code. A suppression outside the package directory is not checked.
# - configuration: tests/libs/test_post_export.py fails if `per-file-ignores` maps TID251
#   (or a prefix of it) to anything but `tests/**`, or if `ignore` / `extend-ignore` (top
#   level or under `lint`) holds TID251 or a prefix. A ruff `exclude` / `extend-exclude`, a
#   second ruff configuration file, or a CLI `--ignore` is not checked.
# - third-party code: what a dependency spawns (the Docker SDK's `ssh` transport, credential
#   helpers) is reviewed, not checked.
# - stdlib code that spawns internally (sprint closure 2026-10-12): tests/libs/test_post_export.py
#   AST-scans the runner's stdlib for modules that import `subprocess` / `_posixsubprocess` or
#   call an `os` spawn primitive, and fails on any such module that is neither banned (whole,
#   or through a parent) nor has a named entry here nor is in its reviewed list. That proves
#   the MODULE is accounted for, not every FUNCTION in it: which functions of `imaplib`,
#   `uuid`, `socketserver` and `http.server` are banned by name is review. The builtin
#   `help()` reaches the `pydoc` pager and is not caught; `asyncio` event-loop methods are the
#   runtime-object gap above. A module that hides the spawn behind another module's call
#   (not an import of `subprocess` or an `os.<spawn>` attribute) is not found by the scan.
# - re-export: `traefik_certificate_exporter.libs.post_export.subprocess` is banned, and ruff
#   0.16.5 resolves `from .post_export import subprocess`, `from . import post_export` then
#   `post_export.subprocess.<x>`, and the absolute forms to it (verified; the suppression test
#   plants them). NOT caught: another module's `subprocess` or `os` attribute
#   (`imaplib.subprocess.Popen`, `socketserver.os.fork`, a dependency's -- verified unreported),
#   and `getattr` / `vars` / `sys.modules` access.
#   Review is the only check for those.
# - the `os` names are hand-listed; tests/libs/test_post_export.py derives the spawn-capable
#   set from `dir(os)`, `dir(posix)` (`dir(nt)` on Windows) and `dir(asyncio)` on the runner
#   and fails on any name missing here (Windows-only `os.startfile` is listed by hand). The
#   modules `posix`, `nt`, `_posixsubprocess`, `asyncio.subprocess`,
#   `concurrent.futures.process`, `ctypes` and `webbrowser` are banned whole (ADR-0050,
#   amendment 2026-10-12) and are required by the same test.
# - the init resolver is Python embedded in an s6 shell script, which ruff does not lint.
[tool.ruff.lint]
extend-select = ["TID251", "PGH004"]

[tool.ruff.lint.per-file-ignores]
# The test suite spawns processes (s6 script tests, app signal tests, container tests).
"tests/**" = ["TID251"]

