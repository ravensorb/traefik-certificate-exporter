[tool.poetry]
name = "traefik-certificate-exporter"
version = "0.0.0"
description = "Watches for changes to traefik acme json files and extracts certificates to a specific folder"
authors = ["Shawn Anderson <sanderson@eye-catcher.com>"]
readme = "README.md"
repository = "https://github.com/ravensorb/traefik-certificate-exporter"
homepage = "https://github.com/ravensorb/traefik-certificate-exporter"
keywords = ['traefik', 'letsencrypt']
packages = [
    {include = "traefik_certificate_exporter", from = "src"},
]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
watchdog = "^6.0"
docker = "^7.2"
confuse = "^2.0.1"
python-dotenv = "^1.2.2"
importlib-resources = "^6.4.0"
jsonpickle = "^3.0.3"
coloredlogs = "^15.0.1"
logging-tree = "^1.9"
cryptography = "^50.0.2"
python-json-logger = "^4.2.0"
apprise = "^1.9.0"
python-dateutil = "^2.9.0"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
pre-commit = "^3.2.1"
pytest = "^9.1.1"
poetry = "^2.4.2"
# Provides the `pysemver` CLI that `just release` uses to compute the next version (AD-15).
semver = "==3.1.0"
mypy = "^2.3.1"
# Dependency gates run as `repo: local` pre-commit hooks; their versions are pinned here by
# poetry.lock, not by a frozen hook `rev` (C-10).
pip-audit = "^2.10.1"
deptry = "^0.25.1"

# Everything a credentialed publish job installs (AD-11): `poetry install --only publish
# --no-root`, so no dev toolchain sits beside a publish token. `twine` is declared here only.
# Optional, yet still in every dev venv and the pip-audit scope, because `just install` and
# build.yaml run `poetry sync --all-groups` (ADR-0042).
[tool.poetry.group.publish]
optional = true

[tool.poetry.group.publish.dependencies]
twine = "^7.0.0"

[tool.poetry.scripts]
traefik-certificate-exporter = "traefik_certificate_exporter.app:main"

[tool.mypy]
python_version = "3.11"
# The pre-commit hook runs in an isolated environment without this project's
# dependencies installed, so import resolution is not the thing being checked here.
ignore_missing_imports = true
# Whether an ignore is "unused" depends on which dependencies are importable, which
# differs between the hook's env and a developer's. Enabling it makes the gate
# environment-dependent.
warn_unused_ignores = false

[[tool.mypy.overrides]]
# The application package predates any type gate and is largely unannotated. It is
# checked in default mode -- a NEW type error there still fails this gate -- without
# requiring annotations. Annotating it is real work with real regression risk and belongs
# in its own change. Removing this block is how that work would start.
module = ["traefik_certificate_exporter.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
# docker-py ships no py.typed; mypy's partial view of it misses its re-exports.
module = ["docker.*"]
follow_imports = "skip"

# Declared-vs-imported check over src/ (review m8, NFR-3), run by the `deptry` pre-commit
# hook. No rule is ignored globally: an exception goes in [tool.deptry.per_rule_ignores],
# naming the one package, with a comment giving the reason and a BL- key.
[tool.deptry]
known_first_party = ["traefik_certificate_exporter"]

# Spine AD-13 (module layering), checked by the `import-linter` pre-commit hook (SD-01-1).
# The contracts derive their scope from the package tree, not a hand-kept list:
# `acyclic_siblings` covers every package under the root, and the `libs` layers contract is
# `exhaustive`, so a new module under libs/ fails until it is placed in a layer.
# Covered: in-package import cycles, upward imports between the listed layers, any libs/
# module importing `app`. Not covered: imports done through `importlib` or strings.
[tool.importlinter]
root_package = "traefik_certificate_exporter"

[[tool.importlinter.contracts]]
id = "no-cycles"
name = "No import cycles between sibling modules (AD-13)"
type = "acyclic_siblings"
ancestors = ["traefik_certificate_exporter"]

[[tool.importlinter.contracts]]
id = "entrypoint-on-top"
name = "app is the entrypoint; nothing under libs imports it (AD-13)"
type = "layers"
layers = ["traefik_certificate_exporter.app", "traefik_certificate_exporter.libs"]

[[tool.importlinter.contracts]]
id = "libs-layers"
name = "libs layering as built: leaves import nothing in-package (AD-13)"
type = "layers"
containers = ["traefik_certificate_exporter.libs"]
exhaustive = true
layers = [
    "certificate_exporter",
    "cli_args",
    "docker",
    "settings",
    "legacy_settings",
    "notify | post_export",
    "logging_utils | object | suggest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a real external service; opt-in via environment"]

[tool.poetry.requires-plugins]
poetry-dynamic-versioning = { version = "==1.10.0", extras = ["plugin"] }

# Git tags are the only version source (AD-7); `version` above is a placeholder.
[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "pep440"
bump = true
metadata = false
strict = true
pattern = '^v(?P<base>\d+\.\d+\.\d+)$'

[build-system]
requires = ["poetry-core==2.4.0", "poetry-dynamic-versioning==1.10.0"]
build-backend = "poetry_dynamic_versioning.backend"
